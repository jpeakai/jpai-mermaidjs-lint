id: MJL-0026
slug: a-split-plan-follows-the-authors-structure
plan_id: null
title: A split plan follows the author's structure, and refuses what it cannot draw faithfully
description: Regions fold first, marker states stay in their composite, and concurrency is refused
status: accepted
accepted_on: 2026-10-18
last_changed_on: 2026-10-18
tags: [complexity, split]

provenance: An adversarial evaluation and an independent semantic oracle found plans the first contract accepted that moved start markers, merged duplicate edges, hid regions and merged concurrent regions
enforced_in:
  - src/split/plan.ts, which climbs author regions first and folds patterns evenly
  - src/split/contract.ts and tests/split/faithful.ts, which read every emitted source back through the shipped parsers
  - tests/split/regressions.test.ts, which holds every evaluation repro

relates_to:
  - relation: extends
    target: MJL-0025
    note: how a fold offered as a split is chosen and drawn
  - relation: extended_by
    target: MJL-0028
    note: decision regions and erDiagram aggregates fold whole
  - relation: extended_by
    target: MJL-0033
    note: regions drawn from one template fold to the same depth and are named by the region around them
  - relation: excepted_by
    target: MJL-0034
    note: a region holding most of a diagram folds as its parts first

decision:
  given: a diagram over a threshold can be folded many ways, and some folds change what it says
  we_prefer: folding the author's own regions first and folding repeated patterns evenly. A state a composite's marker reaches stays in that composite, and each edge between kept nodes is drawn as often as it was written. Edges from another group start at one stub for that group. A composite with concurrent regions gets no plan
  because: a reader trusts the author's boundaries first. A plan that moves a marker, merges an edge or joins concurrent regions says something the original does not
  unless: no plan meets the contract, when the finding keeps the subgraph hint
consequences:
  pros:
    - Every emitted overview and detail parses back to the original's nodes, regions, edges and markers.
    - A diagram with subgraphs is folded along them, as an author would split it.
  cons:
    - Some state diagrams with pinned composites or concurrent regions get no plan.
    - Drawing region boxes in details costs score, so some details are split again.
