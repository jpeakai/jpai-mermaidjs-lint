<script id="record-data" type="application/json">{"MJL-0001":{"file":"0001-parse-with-mermaids-own-parsers.md","status":"accepted","title":"Every diagram is measured by mermaid's own parsers","markdown":"<!-- GENERATED from MJL-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0002](0002-one-rule-per-finding-code.md) (every complexity rule reads these stats)\n- Extended by [MJL-0022](0022-start-from-the-official-parsers-output.md) (every feature starts from the official parsers' output, not only counting)\n- See also [MJL-0021](0021-the-score-counts-what-a-reader-must-read.md) (which of the parser's records the score counts)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule needs the nodes, edges and subgraphs of a diagram\n\n#### We prefer\n\nreading them from the parser result, over scanning the diagram text\n\n#### Because\n\nthe parser already implements the grammar exactly, so the counts are the ones a reader sees\n\n#### Unless\n\na diagram type has no parser result that exposes structure, which fails as an unparseable diagram\n\n## Consequences\n\n### Pros\n\n- Counts match what a reader sees.\n\n### Cons\n\n- The package depends on mermaid and a DOM shim.\n"},"MJL-0002":{"file":"0002-one-rule-per-finding-code.md","status":"accepted","title":"One rule per finding code, one file per rule","markdown":"<!-- GENERATED from MJL-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (the rules read the parsed stats)\n\n## Decision\n\n### The lens\n\n#### Given\n\na failure needs its own switch and its own message\n\n#### We prefer\n\na rule per code named category-short-name, over a rule that reports several codes\n\n#### Because\n\nthe config can then switch off or tune exactly what a project accepts\n\n#### Unless\n\ntwo codes can never be told apart by a reader\n\n## Consequences\n\n### Pros\n\n- Config can accept one finding without silencing its neighbours.\n\n### Cons\n\n- There are more rule files than codes in the scripts.\n"},"MJL-0003":{"file":"0003-findings-fail-or-the-rule-is-off.md","status":"accepted","title":"A finding fails the run, or the rule is off","markdown":"<!-- GENERATED from MJL-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0020](0020-category-flags-have-the-last-word-for-a-run.md) (a category flag only switches rules on or off for one run)\n\n## Decision\n\n### The lens\n\n#### Given\n\na check is uncertain enough that failing on it seems harsh\n\n#### We prefer\n\nmaking the rule off by default or removing the check, over reporting it without failing\n\n#### Because\n\na run that exits 0 should have nothing to report\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- The exit code and the output always agree.\n\n### Cons\n\n- A borderline heuristic must be removed or opted into.\n"},"MJL-0004":{"file":"0004-complexity-is-never-autofixed.md","status":"accepted","title":"No complexity rule has a fixer","markdown":"<!-- GENERATED from MJL-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (the split recommendation carries a concrete plan, checked by a contract and still never applied)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram exceeds a node or score threshold\n\n#### We prefer\n\nreporting it with a split recommendation, over rewriting it\n\n#### Because\n\nthe boundary of a split is a design decision\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A fix never changes what a diagram means.\n\n### Cons\n\n- A complexity finding always needs a human.\n"},"MJL-0005":{"file":"0005-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the answer is a design choice","markdown":"<!-- GENERATED from MJL-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0006](0006-every-fix-is-verified-by-reparse.md) (the verifier backs a refusal with proof)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan that breaks its contract is not offered, as an unsure fixer refuses)\n\n## Decision\n\n### The lens\n\n#### Given\n\na failing label colour has many passing replacements\n\n#### We prefer\n\nreplacing a declared color only with black or white, and refusing otherwise, over choosing a nearby shade\n\n#### Because\n\nthe choice is deterministic and verifiable, and anything subtler is a design decision\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff.\n\n### Cons\n\n- Some fixable palettes stay reported.\n"},"MJL-0006":{"file":"0006-every-fix-is-verified-by-reparse.md","status":"accepted","title":"Every edit is proven by re-parsing the document","markdown":"<!-- GENERATED from MJL-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0005](0005-a-fixer-refuses-when-unsure.md) (a refusal is the normal outcome of a failed proof)\n\n## Decision\n\n### The lens\n\n#### Given\n\nan edit has been spliced into the source\n\n#### We prefer\n\nre-parsing the whole document and comparing structure, over trusting the fixer's offsets\n\n#### Because\n\nthe mermaid parser and the markdown parser are the authority on what the document says\n\n#### Unless\n\nthe expectation is same-tree, which only compares the markdown tree\n\n## Consequences\n\n### Pros\n\n- A buggy or plugin fixer cannot corrupt a diagram unnoticed.\n\n### Cons\n\n- Every fix pass parses mermaid again.\n"},"MJL-0007":{"file":"0007-plugins-follow-the-prose-gates-contract.md","status":"accepted","title":"Plugins follow the prose-gates contract","markdown":"<!-- GENERATED from MJL-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na user wants a rule this package does not ship\n\n#### We prefer\n\na plugin whose default export is { meta, rules }, discovered from .mermaidjs-lint/rules and mermaidjs-lint-plugin-* dependencies, over a second rule interface\n\n#### Because\n\nthe engine, the verifier and the config treat every rule alike, and one convention serves both tools\n\n#### Unless\n\nthe contract must change in a way a plugin would notice, which bumps apiVersion\n\n## Consequences\n\n### Pros\n\n- A plugin rule is configured and listed like a built-in.\n\n### Cons\n\n- apiVersion is one integer, so a breaking change fails every plugin.\n"},"MJL-0008":{"file":"0008-node-bundle-keeps-mermaid-external.md","status":"accepted","title":"The Node bundle keeps mermaid and its parsers external","markdown":"<!-- GENERATED from MJL-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\ndist must run on Node without Bun\n\n#### We prefer\n\nbundling only this package's own source, over bundling every dependency\n\n#### Because\n\nnpm already installs the dependencies, and mermaid chooses its own dynamic imports\n\n#### Unless\n\na dependency ships TypeScript only\n\n## Consequences\n\n### Pros\n\n- The bundle stays small and mermaid resolves itself.\n\n### Cons\n\n- A consumer needs the dependencies installed.\n"},"MJL-0009":{"file":"0009-a-diagram-is-read-from-the-markdown-tree.md","status":"accepted","title":"A diagram is a code node of the markdown tree","markdown":"<!-- GENERATED from MJL-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the markdown tree comes only from mdast)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule or a fixer needs the diagrams of a document and their positions\n\n#### We prefer\n\ntaking them from the parsed tree and mapping a directive back to the source line, over scanning lines\n\n#### Because\n\nthe tree gives exact fences and exemptions, and a mapped line lets a fixer edit inside a list or quote\n\n#### Unless\n\na line cannot be mapped back, in which case the fixer refuses\n\n## Consequences\n\n### Pros\n\n- Every fence the renderer would draw is checked.\n\n### Cons\n\n- A fence tagged mermaid with extra attributes is also read, which the scripts did not.\n"},"MJL-0010":{"file":"0010-thresholds-are-options-not-environment.md","status":"accepted","title":"Thresholds are rule options and flags, never environment variables","markdown":"<!-- GENERATED from MJL-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na project needs different density limits\n\n#### We prefer\n\nsetting preset or a numeric threshold per rule in the config, with a run flag on top, over environment variables\n\n#### Because\n\nthe config is committed and reviewed, so the verdict is reproducible\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A verdict is a function of the repo and the command line.\n\n### Cons\n\n- A CI job that relied on the variables must move to the config.\n"},"MJL-0011":{"file":"0011-profile-decides-who-owns-label-text.md","status":"accepted","title":"A contrast profile decides who owns the label text","markdown":"<!-- GENERATED from MJL-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram is read through a host theme that overrides its colours\n\n#### We prefer\n\nscoring the host text against each fill composited over both theme backgrounds, over scoring the declared color\n\n#### Because\n\nthe pair a reader sees is the one that must pass\n\n#### Unless\n\nthe profile is github, where the author controls the text\n\n## Consequences\n\n### Pros\n\n- A diagram that passes reads in both themes.\n\n### Cons\n\n- The host's colours are constants that can drift from the theme.\n"},"MJL-0012":{"file":"0012-a-fixture-declares-its-own-expectation.md","status":"accepted","title":"A fixture declares what it must report in its own file","markdown":"<!-- GENERATED from MJL-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\ndiagrams that misbehave keep turning up, and each one should become a regression case\n\n#### We prefer\n\nan expect comment inside the fixture plus an optional .fixed sibling, over a central table of expectations in test code\n\n#### Because\n\nadding a case is then adding one file, and the expectation travels with the diagram it describes\n\n#### Unless\n\na case needs options or a profile other than the defaults, which then needs a richer comment\n\n## Consequences\n\n### Pros\n\n- A contributor adds a case without touching test code.\n- The docs site renders the same files with the same expectations.\n\n### Cons\n\n- Distinct rule ids are compared, not finding counts or lines, so a second finding of the same rule goes unnoticed.\n"},"MJL-0013":{"file":"0013-the-docs-site-is-generated-from-tested-sources.md","status":"accepted","title":"The docs site is generated from the sources the tests run","markdown":"<!-- GENERATED from MJL-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe site shows every rule and fixture before and after --fix, rendered through Material\n\n#### We prefer\n\ngenerating the reference pages at build time from RULES.md, tests/fixtures and examples, over committing hand-written pages\n\n#### Because\n\na page that is regenerated and re-checked on every build cannot show behaviour the tool no longer has\n\n#### Unless\n\na page explains something no test source holds, which is then authored under docs-site/docs and linted like any other page\n\n## Consequences\n\n### Pros\n\n- The site doubles as a test suite, run on every pull request.\n- The site lives in docs-site, so only its own pages are scored under the mkdocs-material profile.\n\n### Cons\n\n- The reference pages exist only after make site, so they cannot be read on GitHub.\n"},"MJL-0014":{"file":"0014-an-llm-fix-is-committed-and-verified.md","status":"accepted","title":"An LLM fix is committed beside its fixture and verified clean","markdown":"<!-- GENERATED from MJL-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe gallery should show what an LLM would change to clear a finding that --fix refuses\n\n#### We prefer\n\nan LLM fix authored once and committed as a .llm sibling with its reason, over calling a model while the site builds\n\n#### Because\n\na committed fix is reviewed like code, gives the same page on every build, and needs no API key or network in CI\n\n#### Unless\n\nthe corpus grows past what can be reviewed by hand, when a script may draft fixes that are still committed and checked\n\n## Consequences\n\n### Pros\n\n- Every refused finding in the gallery shows a reviewed, working resolution and the reason for it.\n- The suite proves each LLM fix clears its findings, so a stale one fails CI.\n\n### Cons\n\n- An LLM fix can drift in meaning from its fixture while still linting clean, and only review catches that.\n"},"MJL-0015":{"file":"0015-four-tenets-define-the-tool.md","status":"accepted","title":"Four tenets define what the tool guarantees","markdown":"<!-- GENERATED from MJL-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (split plans serve the visual complexity tenet)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule, a flag or a feature is proposed for the core package\n\n#### We prefer\n\naccepting it only when it serves one of the four tenets, over accepting any useful check\n\n#### Because\n\nfour stated guarantees tell a user what a clean run means, and tell a contributor what the core is for\n\n#### Unless\n\na check serves none of them, in which case it ships as a plugin, which the fourth tenet exists to make easy\n\n## Consequences\n\n### Pros\n\n- A clean run has a precise meaning a user can rely on.\n- Scope questions are settled by pointing at a tenet, not by taste.\n\n### Cons\n\n- Useful checks outside the tenets, such as a house naming style, have to live in plugins.\n"},"MJL-0016":{"file":"0016-a-back-edge-may-be-appended-to-an-accepted-record.md","status":"accepted","title":"A back-edge may be appended to an accepted record","markdown":"<!-- GENERATED from MJL-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na new record declares a typed relation, such as supersedes, to an older accepted record\n\n#### We prefer\n\nappending the inverse relation to the older record's relates_to, over leaving the relation one-way\n\n#### Because\n\nthe graph is only checkable when both ends agree, and the append adds a fact without changing what the older record decided\n\n#### Unless\n\nthe edit would change any other field of the older record, which still needs a new superseding record\n\n## Consequences\n\n### Pros\n\n- Every relation can be read from either end, and the generator can check the pair.\n\n### Cons\n\n- Accepted records are no longer byte-for-byte frozen, so review must check an edit touches relates_to only.\n"},"MJL-0017":{"file":"0017-sequence-colours-come-from-mermaids-theme-engine.md","status":"accepted","title":"Sequence colours come from Mermaid's own theme engine","markdown":"<!-- GENERATED from MJL-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0018](0018-a-host-sets-the-page-canvas-under-github-only.md) (the sequence pairs on the page are scored on the canvas)\n- See also [MJL-0024](0024-colour-and-contrast-come-from-colorjs.md) (their contrast is scored by colorjs.io)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sequence diagram has no style directives, and its colours are theme variables that Mermaid derives from each other\n\n#### We prefer\n\nreading the config with mermaid.parse and resolving every variable with Mermaid's theme engine on an exact pinned version, over copying Mermaid's palettes into the package\n\n#### Because\n\nthe derived colours change between Mermaid releases, and a copy drifts silently while a pin changes only in a reviewed bump\n\n#### Unless\n\nthe profile is mkdocs-material, where Material's CSS forces every sequence label and box, so only lifelines, arrowheads and activation bars are scored, as advisory borders\n\n## Consequences\n\n### Pros\n\n- A sequence diagram that passes reads in both themes on the pinned Mermaid.\n- Frontmatter and init directives merge the way the renderer merges them.\n\n### Cons\n\n- A consumer gets the pinned Mermaid, and a host on another version may derive other colours.\n- Mermaid's own dark theme draws note text at 4.49 to 1, so a note with no colours set fails.\n"},"MJL-0018":{"file":"0018-a-host-sets-the-page-canvas-under-github-only.md","status":"accepted","title":"A host sets the page canvas, under the github profile only","markdown":"<!-- GENERATED from MJL-0018 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0017](0017-sequence-colours-come-from-mermaids-theme-engine.md) (the sequence pairs on the page are scored on the canvas)\n- Excepted by [MJL-0019](0019-a-material-file-sets-a-config-canvas-aside.md) (a config canvas on a file the auto profile reads as mkdocs-material is set aside rather than refused)\n\n## Decision\n\n### The lens\n\n#### Given\n\ntranslucent fills, edge label boxes and page-backed sequence elements are scored on the page colour. A host other than GitHub draws its own page.\n\n#### We prefer\n\na canvas of opaque light and dark colours that defaults to GitHub's, over fixed GitHub colours or a profile per host. It is set by --canvas-light and --canvas-dark, a canvas rule option or RunFlags.\n\n#### Because\n\nthe page is the one github profile assumption a host may change. One setting covers every page-backed pair without a new profile.\n\n#### Unless\n\nthe file is scored under mkdocs-material, whose page is Material's own. There a canvas is a usage error rather than ignored, because an ignored canvas reports a pass it never affected.\n\n## Consequences\n\n### Pros\n\n- A host with its own page colours scores diagrams as its readers see them.\n- A run that sets no canvas reports exactly what it did before.\n\n### Cons\n\n- A run over a tree where auto picks mkdocs-material for some files fails if it sets a canvas, so those files need their own run.\n- The canvas is a page colour only. A host that also restyles Mermaid's own surfaces is not modelled.\n"},"MJL-0019":{"file":"0019-a-material-file-sets-a-config-canvas-aside.md","status":"accepted","title":"A Material file sets a config canvas aside","markdown":"<!-- GENERATED from MJL-0019 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0018](0018-a-host-sets-the-page-canvas-under-github-only.md) (a config canvas on a file the auto profile reads as mkdocs-material is set aside rather than refused)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe auto profile reads a file as mkdocs-material, and the only canvas for it comes from the config, which covers the whole tree\n\n#### We prefer\n\nsetting the canvas aside for that file, scoring it under mkdocs-material, and printing one note that names every such file, over stopping the run\n\n#### Because\n\nthe config cannot scope a canvas to a path, and the auto profile already decides which page each file is drawn on. The note keeps the set-aside visible, so it never reads as a silent pass.\n\n#### Unless\n\nthe canvas comes from --canvas-light or --canvas-dark, or the profile is set to mkdocs-material by flag or rule option. Each of those is an explicit setting for this run, so it is still refused with a usage error.\n\n## Consequences\n\n### Pros\n\n- One config with a canvas serves a repo that holds a Material site beside its GitHub-rendered markdown.\n- The run reports findings for every file instead of stopping at the first Material file.\n\n### Cons\n\n- A config canvas that the user meant for a Material file is dropped rather than refused, so the note is the only signal.\n"},"MJL-0020":{"file":"0020-category-flags-have-the-last-word-for-a-run.md","status":"accepted","title":"Category flags have the last word for a run","markdown":"<!-- GENERATED from MJL-0020 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0003](0003-findings-fail-or-the-rule-is-off.md) (a category flag only switches rules on or off, so a finding still fails the run or its rule is off)\n\n## Decision\n\n### The lens\n\n#### Given\n\na user wants one run to check a different set of categories from the one the config describes\n\n#### We prefer\n\nsettling the rules in three steps. Every loaded rule starts on, the config turns some off, then the category flags turn whole categories on or off\n\n#### Because\n\na flag is an explicit choice for this run, so it outranks the standing config, as --preset and --profile already do. A re-enabled rule keeps its configured options, so it runs as the config describes it.\n\n#### Unless\n\nthe flags name a category no loaded source declares, name one category both ways, or turn off every rule. Each would check something other than what was asked, so it is a usage error rather than a guess.\n\n## Consequences\n\n### Pros\n\n- A run can check one category, or skip one, without touching the config.\n- --list-rules with the same flags shows exactly which rules a run would use.\n\n### Cons\n\n- A run can pass with a category switched off, so a CI gate that wants every category must not pass --disable-category.\n"},"MJL-0021":{"file":"0021-the-score-counts-what-a-reader-must-read.md","status":"accepted","title":"The score counts what a reader must read, not every record the parser keeps","markdown":"<!-- GENERATED from MJL-0021 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (every count is still read from the parser's result, never the text)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan's overview and details are scored by this score)\n\n## Decision\n\n### The lens\n\n#### Given\n\na parser's result holds records with nothing to read, such as a block's closing line or a start marker. It also files some things a reader does read, such as attributes, outside its nodes\n\n#### We prefer\n\ncounting messages, boxes, blocks, states and rows, and leaving out control lines, markers and notes. That is preferred over counting every record the parser keeps\n\n#### Because\n\nthe score stands for what a reader must find, trace and hold. A record with nothing to read inflates it, and a missed boundary or row deflates it\n\n#### Unless\n\na type draws a record as something the reader must place, as a fork or a choice is, which stays a node\n\n## Consequences\n\n### Pros\n\n- A sequence diagram with blocks, notes and activations scores its messages, not every statement.\n- A large entity or class scores higher than an empty one.\n- A sequence diagram whose blocks nest three deep fires the nesting rule, as a flowchart does.\n\n### Cons\n\n- Scores change for sequence, state, entity and class diagrams, so a diagram near a threshold may cross it either way on upgrade.\n- The row weight is a judgement, not a measured value.\n"},"MJL-0022":{"file":"0022-start-from-the-official-parsers-output.md","status":"accepted","title":"Every feature starts from the official parsers' output, and no parsing logic is reinvented","markdown":"<!-- GENERATED from MJL-0022 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (MJL-0001 covers counting, and this record covers every feature, emitted text and every other dependency)\n- See also [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the same rule for markdown and every other dependency)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan reads the parser's graph and parses its emitted text again)\n- See also [MJL-0027](0027-gaps-in-the-official-parsers-are-recorded.md) (the places the official parsers' output falls short, each with its pinned workaround)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs something a diagram or a document says. That may be a node, an edge label, a shape, an arrow, a block or a fence\n\n#### We prefer\n\nstarting from the result of the canonical parsers, which are mermaid core, @mermaid-js/parser and mdast. That is preferred over writing a parser, a tokeniser or a regex over the text, and over rebuilding anything an installed dependency already provides\n\n#### Because\n\nthe official parsers implement the grammar the renderer draws, so a reimplementation can only drift from it. A second parser also doubles the code to test and maintain\n\n#### Unless\n\nnever. Text a feature emits is checked by parsing it again with the same parsers, never by scanning it\n\n## Consequences\n\n### Pros\n\n- Every structure a rule or a split plan reads is the one mermaid draws.\n- A new mermaid release that changes the grammar changes this package's reading with it.\n\n### Cons\n\n- A fact the parser result does not expose cannot be used until mermaid exposes it.\n- Some parser results are internal shapes, which a mermaid upgrade may change and the tests must catch.\n"},"MJL-0023":{"file":"0023-markdown-is-read-only-through-mdast.md","status":"accepted","title":"Markdown is read only through mdast, and reimplementing a dependency is non-compliance","markdown":"<!-- GENERATED from MJL-0023 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0009](0009-a-diagram-is-read-from-the-markdown-tree.md) (a diagram is read from the markdown tree, and that tree comes only from mdast)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (the same rule for diagram text and mermaid's parsers)\n- See also [MJL-0024](0024-colour-and-contrast-come-from-colorjs.md) (the same rule for colour parsing and contrast)\n- Extended by [MJL-0027](0027-gaps-in-the-official-parsers-are-recorded.md) (the recorded gaps in mermaid, each with the one narrow workaround allowed)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs a markdown structure, such as a fence, its language, its position, a heading or frontmatter. Or it needs something an installed dependency already provides\n\n#### We prefer\n\nreading markdown only from the mdast tree, and calling the dependency that already does the job. That is preferred over a custom markdown parser, and over reimplementing any part of a library this package depends on\n\n#### Because\n\nthe dependency is already tested, maintained and shipped, so a second version only adds code that can drift from it. Duplicated logic is treated as non-compliance and refactored onto the dependency\n\n#### Unless\n\nnever. When a dependency lacks a feature, the gap is recorded and solved with another maintained library, not a hand-written parser\n\n## Consequences\n\n### Pros\n\n- Every fence and position the linter reports is the one CommonMark and GFM define.\n- Less code to test, and fixes upstream arrive with an upgrade.\n\n### Cons\n\n- A behaviour the dependency gets wrong must be fixed upstream or worked around in its output, never by parsing the text again.\n"},"MJL-0024":{"file":"0024-colour-and-contrast-come-from-colorjs.md","status":"accepted","title":"Colour parsing and WCAG contrast come only from colorjs.io","markdown":"<!-- GENERATED from MJL-0024 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the same rule for markdown and every other dependency)\n- See also [MJL-0017](0017-sequence-colours-come-from-mermaids-theme-engine.md) (sequence colours come from mermaid's theme engine, and their contrast from colorjs.io)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule needs to read a colour, blend a translucent fill, or score contrast against WCAG or APCA\n\n#### We prefer\n\ncalling colorjs.io for the parse, the colour space conversion and the contrast ratio. That is preferred over writing our own colour parser, luminance formula or ratio\n\n#### Because\n\ncolorjs.io reads every CSS Color Level 4 syntax and implements the published WCAG 2.1 and APCA algorithms. A copy of that maths can only drift from it\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A ratio the linter reports matches the WCAG 2.1 definition, for every colour syntax a browser reads.\n\n### Cons\n\n- The contrast rules depend on colorjs.io's release cadence for any change to a contrast algorithm.\n"},"MJL-0025":{"file":"0025-a-fold-is-offered-as-a-split.md","status":"accepted","title":"A fold is offered only as the overview half of a split","markdown":"<!-- GENERATED from MJL-0025 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (how a plan is chosen and drawn faithfully)\n- Extends [MJL-0004](0004-complexity-is-never-autofixed.md) (the split recommendation now carries a concrete plan, and is still never applied)\n- See also [MJL-0005](0005-a-fixer-refuses-when-unsure.md) (like a fixer that is unsure, a plan that breaks the contract is not offered)\n- See also [MJL-0015](0015-four-tenets-define-the-tool.md) (the plan serves the visual complexity tenet)\n- See also [MJL-0021](0021-the-score-counts-what-a-reader-must-read.md) (the overview and every detail are scored by the same visual complexity score)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (the plan reads the parser's graph, and its emitted text is checked by parsing it again)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram over a node count or score threshold\n\n#### We prefer\n\noffering a fold only as the overview half of a split, with one detail diagram per group, checked by a contract on the emitted text. That is preferred over a replacement diagram, and over a fixer\n\n#### Because\n\nthe boundary of a split is a design decision, so the plan is a recommendation a human applies (MJL-0004). A split also stays recoverable, since the overview and the details together keep every node and edge\n\n#### Unless\n\nno plan meets the contract. Then no plan is offered, and the finding keeps its subgraph hint\n\n## Consequences\n\n### Pros\n\n- A complexity finding names where to cut, not only how small to cut.\n- A plan never loses a node or an edge, because the contract parses what it emits.\n- The tool still never edits a diagram for a complexity finding.\n\n### Cons\n\n- Working out a plan adds time to a check of every oversized diagram.\n- A plan groups by structure and label stems, so its groups may not match the author's intent.\n- Compromise was rejected, so the label stemming stays in this package and is tested here.\n"},"MJL-0026":{"file":"0026-a-split-plan-follows-the-authors-structure.md","status":"accepted","title":"A split plan follows the author's structure, and refuses what it cannot draw faithfully","markdown":"<!-- GENERATED from MJL-0026 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (how a fold offered as a split is chosen and drawn)\n- Extended by [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (decision regions and erDiagram aggregates fold whole)\n- Extended by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (regions drawn from one template fold to the same depth and are named by the region around them)\n- Excepted by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a region holding most of a diagram folds as its parts first)\n- Extended by [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (an author region folds whole however much of a diagram it holds)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram over a threshold can be folded many ways, and some folds change what it says\n\n#### We prefer\n\nfolding the author's own regions first and folding repeated patterns evenly. A state a composite's marker reaches stays in that composite, and each edge between kept nodes is drawn as often as it was written. Edges from another group start at one stub for that group. A composite with concurrent regions gets no plan\n\n#### Because\n\na reader trusts the author's boundaries first. A plan that moves a marker, merges an edge or joins concurrent regions says something the original does not\n\n#### Unless\n\nno plan meets the contract, when the finding keeps the subgraph hint\n\n## Consequences\n\n### Pros\n\n- Every emitted overview and detail parses back to the original's nodes, regions, edges and markers.\n- A diagram with subgraphs is folded along them, as an author would split it.\n\n### Cons\n\n- Some state diagrams with pinned composites or concurrent regions get no plan.\n- Drawing region boxes in details costs score, so some details are split again.\n"},"MJL-0027":{"file":"0027-gaps-in-the-official-parsers-are-recorded.md","status":"accepted","title":"Gaps in the official parsers are recorded, each with the one narrow workaround allowed","markdown":"<!-- GENERATED from MJL-0027 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (MJL-0023 says a dependency gap is recorded rather than hand-written, and this record is that list)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (every feature starts from the official parsers' output, and these are the places that output falls short)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs something mermaid does not expose. There are four such gaps. First, mermaid keeps no source map from the preprocessed text it parses back to the diagram source. Second, decodeEntities is exported only from a hash-named chunk. Third, mermaid core has no zenuml detector. Fourth, styles2Map, which reads a style declaration, is internal\n\n#### We prefer\n\none narrow workaround per gap, each pinned by a test. A position is recovered only from the official lexer's tokens. A parsed line is placed in the source only when exactly one body line past the frontmatter can be it. Otherwise the span is refused. decodeEntities is a copy whose behaviour a test pins to mermaid's. The zenuml detector is a one-line type detector registered through registerExternalDiagrams. styles2Map is a mirror whose output a test pins to mermaid's compiled styles. That is preferred over a custom parser, and over a text match that picks a best guess\n\n#### Because\n\neach workaround stays as small as the gap, and its test fails the day mermaid's behaviour drifts from it. A refusal keeps a fixer from rewriting text it cannot place, per MJL-0005\n\n#### Unless\n\nmermaid exposes the missing piece, when the workaround is deleted and the dependency is called instead. A new gap is added to this record by a superseding record, never worked around unrecorded\n\n## Consequences\n\n### Pros\n\n- Every place the package does not call mermaid directly is listed in one record, with the test that pins it.\n- A position that could be wrong is refused, so a fix never edits frontmatter or a line mermaid dropped.\n\n### Cons\n\n- Some values, such as a classDiagram's or one after text mermaid edited out, are never placed, so their contrast findings are reported without a fix.\n- The tests read mermaid's hash-named chunks, which a mermaid upgrade renames, so they find each chunk by its source text.\n"},"MJL-0028":{"file":"0028-decision-regions-and-aggregates-fold-whole.md","status":"accepted","title":"Decision regions and erDiagram aggregates fold whole, named after their decision or root","markdown":"<!-- GENERATED from MJL-0028 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (the author's structure now includes the regions a flow's decisions make and the aggregates an erDiagram's identifying relationships make)\n- Extended by [MJL-0029](0029-runs-meshes-and-terminals-read-as-they-are.md) (runs named by range, dense meshes folded by cliques, shared terminals kept in view)\n- Excepted by [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (an aggregate whose root is a lookup is named after its most crossed member)\n- Excepted by [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (any owner's aggregate may fold uncapped, never one swallowing a group over the target)\n- Extended by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a tangled erDiagram folds aggregates past the target, down to the share an evened overview keeps)\n- Excepted by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (an aggregate draws no relationship twice, and a root's aggregate may fold trimmed)\n- Excepted by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (a group of two shows the other member's label in place of the count)\n- Excepted by [MJL-0041](0041-an-oversized-decision-region-opens-and-a-span-label-shows-whole.md) (a decision region folded far larger than the median group opens, and the regions inside it fold apart)\n\n## Decision\n\n### The lens\n\n#### Given\n\nsome diagrams are mostly decisions, a flowchart or stateDiagram. In others, an erDiagram overview groups entities by leaves and junctions, not by what owns what\n\n#### We prefer\n\nfolding a decision with its region, from the decision to its immediate post-dominator, where its branches rejoin. Dominators and post-dominators come from the algorithm of Cooper, Harvey and Kennedy (2001), with a virtual entry and exit. A branch ending at a terminal node is an outcome folded inside the region, not an exit from it. Every edge into the region enters the decision, and every edge out reaches the rejoin node. These are the regions of the program structure tree of Johnson, Pearson and Pingali (1994). Such a fold invents no path, so it belongs to T2, the lossless tier. Regions fold innermost first, are named after their decision, and keep their branch labels in the detail. A chain stage may pass through a folded region. In an erDiagram an entity is owned by its single identifying parent, or as a leaf by the one entity it depends on. T4 folds the largest aggregate whose detail fits, named after its root, or each root's aggregate split again when none fits. A junction identified by two roots folds into neither side, and T5 and T6 keep it in view\n\n#### Because\n\na decision's branches only make sense together, and a region folded whole keeps them together without adding reachability. Identifying relationships are the author's statement of ownership, so an overview whose edges run between aggregate roots reads as the author's model\n\n#### Unless\n\na region has a second entry or a second exit. Then the decision stays protected. An erDiagram with no identifying relationship is folded by T5 and T6 as before\n\n## Consequences\n\n### Pros\n\n- Decision-heavy flowcharts get plans that read as a sequence of named checks.\n- The declared loss after T2 stays zero, since a decision region adds no reachable pair.\n- erDiagram overviews connect aggregate roots, and a junction table stays a junction.\n\n### Cons\n\n- A decision whose branches leave through two different nodes is still protected, so some flows get no region.\n- An aggregate split again draws no rows, so more attribute rows are declared dropped.\n"},"MJL-0029":{"file":"0029-runs-meshes-and-terminals-read-as-they-are.md","status":"accepted","title":"Runs of alike nodes are named by range, dense meshes fold by cliques, and shared terminals stay in view","markdown":"<!-- GENERATED from MJL-0029 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (how groups are named and chosen once regions and aggregates have folded)\n- Extended by [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (groups named where a reader enters them, dense meshes refused, terminals that lead only to ends kept in view)\n- Excepted by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (sibling-leaf runs named by range are not offered when they are every group of one star)\n- Excepted by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (twin chains are never cut into runs, since no label sorts lanes)\n\n## Decision\n\n### The lens\n\n#### Given\n\nsome groups hold interchangeable members, twins, sibling leaves or id-labelled states, where no single member names the group. A dense mesh joins nearly every pair, so a pair says little, and a node many paths end at is no one branch's end\n\n#### We prefer\n\nnaming such a group by range: its first and last member labels in natural order, joined by a spaced ellipsis. N counts the members neither end names. A range is offered for twins and sibling leaves, or when every member's label leads with an id. It needs three members or more, forty characters at most and no markup. It is refused when a member of another group has a label from the first to the last. A reader would look for that member there. An id-led group with no honest range is named by its first label in natural order. Twins are ordered by label before they are cut into runs, so runs read as alphabetical volumes. In a mesh whose overview joins at least half of all pairs, T6 also proposes maximal cliques of ungrouped nodes. These come from Bron and Kerbosch's algorithm with Tomita's pivot, taken in natural order and capped at 256. Each clique is cut into runs whose detail fits and ranked by the summed modularity gain of its pairs. A shared terminal is a flowchart or state node at least three nodes lead into and that leads nowhere. It keeps its own node under the strict rules, and under a second rule set that folds hubs and branches. Only the loose rules after those fold it\n\n#### Because\n\na range names exactly what a group holds and where its neighbours begin. A clique is a group whose members all talk to each other. A terminal folded into one branch tells the reader the other branches end somewhere else\n\n#### Unless\n\na group has an author region or a head, whose label still comes first. A terminal folds when no rule set short of the loose ones meets the target\n\n## Consequences\n\n### Pros\n\n- A run of services reads as an index, \"accounts-service \u2026 feature-flag-service (+9)\".\n- Groups in a dense mesh are cliques, and a final state or alert node stays where every path can be seen to reach it.\n- The contract, faithful.ts and the strict checker accept a range only in its one exact form.\n\n### Cons\n\n- A range label is longer than a member label, so fewer groups qualify than might.\n- A diagram whose strict walk fails is walked once more before the loose rules, which costs time.\n"},"MJL-0030":{"file":"0030-a-group-is-named-where-a-reader-enters-it.md","status":"accepted","title":"A group is named where a reader enters it, a dense mesh is refused, and a state that ends the flow stays in view","markdown":"<!-- GENERATED from MJL-0030 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0029](0029-runs-meshes-and-terminals-read-as-they-are.md) (how groups are named and when a dense mesh is planned at all, beyond ranges, cliques and terminals)\n- Scoped exception to [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (an aggregate whose root is a lookup is named after another member, not its root)\n- Extended by [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (stubs drawn apart for one group are told apart by the member each one's edges leave)\n- Excepted by [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (under the strict rules a pair never crosses two prefix families)\n- Excepted by [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (edges from one group drawing alike are drawn once from one stub, not from a stub each)\n- Extended by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a star of leaves sorted by nothing is refused, as a dense mesh is)\n- Extended by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a refused dense mesh prints every link as an adjacency matrix)\n- Excepted by [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (twin chains whose stages a namespace or a first word names are named by those stages, not by an entry)\n\n## Decision\n\n### The lens\n\n#### Given\n\na group's name is the first thing a reader reads of it, and the overview's edges are read between those names. Some diagrams cannot be summarised by folding at all, and some states end every failure path without being sinks themselves\n\n#### We prefer\n\nnaming a chain-like group in a flowchart or stateDiagram after its entry, the member no member leads into. A chain-like group's members form one directed path, or several disjoint ones for twin chains. Twin chains are named after the entry the flow reaches first, then the first by label, and never by a range spanning two stages. An aggregate whose root is a lookup is named after the member with the most edges crossing the group's boundary. A lookup root is one every edge of which joins one other member. A pair that would mix two pipeline stages, read from a dotted label prefix such as bronze. or an id prefix such as br_, loses a tie between equal modularity gains, and only a tie. A dense mesh is refused with the reason \"dense mesh: a matrix or table reads better than a diagram\". A graph is a dense mesh when it joins at least half of all its node pairs and more pairs than twice its nodes. Its nodes then average more than four links. The check runs on the diagram before planning and on each plan's overview after it. A shared terminal also covers a node at least three nodes lead into whose every successor leads nowhere. An example is Cancelled, leading only to Refunded and Voided. Two edges from different members of one outside group can draw one edge twice in a detail. Each then gets a stub of its own, when the detail still meets its target, as its rows are drawn. An overview's edges are ordered by the pair of nodes they join, whichever way each is written, so parallel edges sit side by side. Of two aggregates that save as much score per node hidden, the one leaving fewer edges between overview nodes goes first. A decision region hiding one node is undone when the overview and every detail still meet the target without it. That is how a suggested group hiding one node is undone, but a region is never merged into a neighbour\n\n#### Because\n\na reader enters a chain where it starts, and a lookup's name says nothing of the aggregate whose edges all leave from another member. Folding a dense mesh leaves a dense mesh, since its groups are joined to each other too, so no fold makes it readable. A state every failure ends at reads as one branch's end when folded into that branch. One edge drawn twice from one stub reads as a duplicate, not as two sources\n\n#### Unless\n\na group has an author region or a decision region's head, whose label still comes first. An erDiagram keeps every parallel edge, since cardinalities and labels are never merged\n\n## Consequences\n\n### Pros\n\n- The Sakila overview reads \"FILM (+1) casts FILM_ACTOR\", and a pipeline's first group reads \"git push to main (+5)\".\n- A mesh gets a reason a reader can act on, not an overview that still joins every pair.\n- A happy path's group no longer hides the state its failures end at.\n\n### Cons\n\n- A detail may hold one more stub than before, so its target is met a little later.\n- A stage read from an id prefix can be wrong, which is why it only breaks ties.\n- A dense diagram that a reader might still want folded gets no plan.\n"},"MJL-0031":{"file":"0031-a-plan-keeps-groups-even-and-names-each-stub-once.md","status":"accepted","title":"A plan lands near its target, keeps groups even and to one family, and names each stub once","markdown":"<!-- GENERATED from MJL-0031 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (stubs drawn apart for one group are told apart by the member each one's edges leave)\n- Scoped exception to [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (under the strict rules a pair never crosses two prefix families)\n- Scoped exception to [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (any owner's aggregate may fold uncapped, never one swallowing a group over the target)\n- Excepted by [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (stubs for one group are never drawn apart, so only a stub beside its namesake member is named by a member)\n- Extended by [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (a family is also read from a status stem, and a pair of one family may share a neighbour)\n- Excepted by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (id families fold whole below the share an evened overview keeps, and a family group is never undone)\n- Extended by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (with hubs folded, prefix families are kept apart before they are mixed, chain stages too)\n- Excepted by [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a member stub names its group by the label the overview shows)\n- Extended by [MJL-0037](0037-stubs-for-one-group-share-a-box-and-the-lighter-detail-draws-exactly.md) (of two leaf folds saving alike, the one leaving groups more even goes first)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of an overview counts its nodes against the target and compares its groups' sizes. A group's name reads as a promise about its members, and parallel lines read as separate relationships. A detail's stubs are read by their text alone\n\n#### We prefer\n\nundoing a group when a walk leaves the overview below 60% of node_target, rounded up. The group undone gives back the most nodes while the overview and every fitting detail still meet their targets. A T2 group stays, since it is one run of a pattern folded evenly. An erDiagram aggregate folded over the target is never folded again into its owner's aggregate. Held to no target, any owner's aggregate may fold, not only a root's. A T5 or T6 group never holds members of two prefix families under the strict rules. A prefix family is the dotted prefix leading a label, such as bronze. Failing that, it is the letters leading an id-led label, such as PLAT- in PLAT-1201. Failing that, it is letters and an underscore leading an id, such as br_. In T6, a pair within one family ranks before any other pair, then by modularity gain. When the target cannot be met so, the plan is walked again with families mixed, before hubs and branches are folded. In T4, T5 and T6, some candidates come within 5% of the best saving per node hidden. In T6 they come within 5% of the best gain, at the same kin. Of those, the one leaving the fewest parallel overview edges is taken. A parallel edge is an overview edge beside another between the same two nodes, at least one a group. Stubs for one whole group drawn apart in one detail would show one text. Each takes \" from \" and the label of the one member its edges leave, as \"Checkout domain (+5) from paymentservice\". So does a whole-group stub beside a stub for the member its group is named after, as \"10007 QA (+2)\" beside \"10007 QA (in group)\". The text must have exactly one reading, the group, and the member must draw every edge the stub draws. When any stub cannot be named so, the detail draws one stub for the group\n\n#### Because\n\na four-node overview of a twenty-two node diagram hides more than the target asks. A group holding half a diagram is a second diagram to read, not a summary. Ticket keys, table namespaces and id prefixes are the author's own grouping, so a group mixing two reads as wrong whatever its modularity. Five lines between two boxes read as noise when another fold saving as much draws none. Three stubs with one text read as a duplicate, while naming each member shows three sources\n\n#### Unless\n\na diagram meets its target only with families mixed, with an uncapped aggregate inside another, or with a stub text that reads two ways. The plan then falls back in that order, as before\n\n## Consequences\n\n### Pros\n\n- The compiler AST overview keeps six nodes at low density, and the Jira epic graph groups each ticket family apart with no new reachable pair.\n- The SaaS billing overview draws no parallel edges and declares no loss.\n- A detail never shows two stubs with one text.\n\n### Cons\n\n- A plan near the cap of node_target can result where a smaller overview was offered before.\n- A family read from an id prefix can be wrong, and under the strict rules it now forbids a merge rather than breaking a tie.\n- A stub's text grows by its member's label.\n"},"MJL-0032":{"file":"0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md","status":"accepted","title":"A pipeline stage folds across its lanes, a status stem names a family, and a stub draws each edge once","markdown":"<!-- GENERATED from MJL-0032 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (edges from one group drawing alike are drawn once from one stub, not from a stub each)\n- Scoped exception to [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (stubs for one group are never drawn apart, so only a stub beside its namesake member is named by a member)\n- Extends [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (a family is also read from a status stem, and a pair of one family may share a neighbour)\n- Extended by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (in a ticket graph a whole id family folds before any pair, hubs included)\n- Excepted by [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a group is drawn whole or as its members, never both, and like edges to a member draw once)\n- Extended by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a pair of one family sharing more overview neighbours folds first, so layers fold in step)\n- Excepted by [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (one member's edges into a group joined one way draw in the target's detail)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of a detail reads each stub as one outside thing and each line as one relationship. A pipeline's stage is the set of tables one step produces, and they rarely feed each other. A workflow named by status ids carries its stages only in the status words\n\n#### We prefer\n\ndrawing an edge from a whole group into a member once. It stands for every edge from that group into the member with one label, kind and cardinality. The source group's own detail draws each of those edges to the exact member, so every original edge still reads back exactly once. The contract, the reading and the checker read such half edges as a set, and a half drawn twice is refused. A whole-group stub may sit beside a stub for the member its group is named after. It still takes \" from \" and the one member its edges leave. It takes none when that member is the namesake, which the group's label already names. In T6, two overview nodes no edge joins are offered as a pair when members of each share an original neighbour. Such a pair is taken only when it names one prefix family. So it ranks with the other pairs of one family, before any other pair. A T6 group must be connected. Two members are joined by an edge between them, or by an author region the group folds whole. They are also joined by a neighbour they share, when both name one prefix family or both are leaves. A label leading with a bare id and naming no prefix family takes a status family. That is the one stem a word after its id shares with another such label, as \"releas\" in \"10008 Ready for Release\" and \"10009 Released\". A label sharing no stem, or two, takes none\n\n#### Because\n\none stub drawn per member, or one stub drawn three times, reads as three sources or a duplicate where the overview draws one edge. The tables of one pipeline stage belong together however few edges join them, and a shared neighbour is the structure that says so. Requiring a shared neighbour and one family keeps every suggested group connected, so a group never gathers unrelated nodes. Two statuses sharing a stem name one stage of a workflow, and a status sharing none says nothing a family could use\n\n#### Unless\n\na diagram meets its target only with families mixed, when the plan falls back as MJL-0031 says. A detail still draws two edges from one stub when their labels or kinds differ\n\n## Consequences\n\n### Pros\n\n- The ETL pipeline folds its five gold tables into one group and declares no new reachable pair.\n- The Jira workflow keeps Ready for Release and Released together, apart from Code Review.\n- No detail draws a stub edge twice or two stubs for one group, so the \" from \" form is rarer.\n\n### Cons\n\n- A target detail no longer shows how many members of the source group lead to a member, only that the group does.\n- A family read from an id prefix or a stem can still be wrong, and now it can join two nodes no edge joins.\n- The contract refuses a suggested group joined only through a node of another family, which no tier made before.\n"},"MJL-0033":{"file":"0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md","status":"accepted","title":"A plan folds ticket families whole, echoing regions alike and tangled aggregates, refuses alphabetical buckets, and draws a group whole or as members","markdown":"<!-- GENERATED from MJL-0033 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (a star of leaves sorted by nothing is refused, as a dense mesh is)\n- Scoped exception to [MJL-0029](0029-runs-meshes-and-terminals-read-as-they-are.md) (sibling-leaf runs named by range are not offered when they are every group of one star)\n- Extends [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (a tangled erDiagram folds aggregates past the target, down to the share an evened overview keeps)\n- Scoped exception to [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (id families fold whole below the share an evened overview keeps, and a family group is never undone)\n- Extends [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (in a ticket graph a whole id family folds before any pair, hubs included)\n- Extends [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (regions drawn from one template fold to the same depth and are named by the region around them)\n- Scoped exception to [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (a group is drawn whole or as its members, never both, and like edges to a member draw once)\n- Extended by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a refused star prints its hub and every leaf as a list)\n- Excepted by [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a tangled erDiagram folds past the target only aggregates adding no new reachable pair)\n- Extended by [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (of two groups joined both ways, the one whose detail is split again draws the other's members)\n- Extended by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (a tangled schema that meets its target by rows alone still folds its aggregates, each pair named by both members)\n- Excepted by [MJL-0039](0039-rows-alone-fold-nothing-and-a-plan-says-why-it-was-flagged.md) (a tangled schema that meets its target by rows alone folds no aggregate)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of an overview reads its groups as the diagram's own structure. The reader compares regions drawn from one template side by side, and counts relationships as lines. A ticket key or a template is the author's own grouping, and an alphabetical range is no grouping at all\n\n#### We prefer\n\nrefusing a plan whose every group is a run of sibling leaves of one twin class, named only by a range. Such groups must hold more than half the diagram. The reason given is \"a star of leaves around one node, which no label, shape or neighbour sorts: a list reads better\". An erDiagram overview is tangled when its independent cycles, edges less nodes plus one, number at least a quarter of its nodes. A tangled one folds aggregates once the target is met, even by dropping rows alone. Each fold must take away an overview edge per entity it hides and add no more new reachable pairs than it hides. It stops at 60% of node_target. When every label leads with an id naming a prefix family, as PLAT-1201, T6 first offers each family whole, hubs included. A family whose detail does not fit is offered as even contiguous runs in natural order, each connected, in one step. Once one family folds, the evening takes only families, down to the fewest nodes a fold may leave. Loosening never undoes a family's group. Two regions echo when they are siblings of one shape holding regions of their own, or children of echoing regions with one label and shape. A region's shape is its own node count and each child region's label and shape. T3 folds a region with all its echoes in one step, and waits for an echo not yet ready. Another group may be named after a region of the same label. A region's group then takes the label of the region around it in brackets, as \"Public subnets (us-east-1) (+2)\". It sits in that region in the overview and counts every member. A plan whose details split again with new reachable pairs is walked again, holding regions to details that fit. That walk first folds only regions adding no new reachable pair. It is offered when it declares fewer new reachable pairs in all. When edges join two groups both ways, one detail draws every edge between them exactly, with stubs for the other's members. That is the detail needing stubs for fewer members, then the first group by key. The other detail draws the group as one stub, with each edge into it from a member read as a half edge. No detail draws a group whole beside a stub for one of its members. The edges of one kind one way between a group's stub and one member draw once. They keep only the label and cardinality they all share, and an erDiagram keeps one per label and cardinality, as the overview does\n\n#### Because\n\nalphabetical buckets give a reader nothing to find, while a list of the leaves gives the same in reading order. An overview of every entity and relationship is the original with its rows hidden, and aggregates are the structure an erDiagram carries. A tree-like overview already reads, so it stays as it is. A ticket family scattered across groups and loose hubs reads as noise, while one group per family reads as the author's plan. Two regions drawn from one template folded to different depths read as different things. Their groups need names a reader can tell apart without an id. One outside group drawn twice in one detail reads as two things, and three lines from one stub into one member read as three sources\n\n#### Unless\n\na plan has no star, or a diagram has no aggregate that takes an edge away per entity. Labels may name no id family, or regions echo none. The plan then stands as before\n\n## Consequences\n\n### Pros\n\n- The gateway is refused with a reason rather than offered alphabetical buckets.\n- The university and film rental overviews fold their aggregates, and the WordPress tree stays at rows dropped.\n- The Jira epic graph shows one group per ticket family and no loose node.\n- The two cloud regions fold into three subnets each, named apart, with no new reachable pair and no detail split again.\n- No detail draws one group as two stubs, and the order lifecycle's returns fold into one group.\n\n### Cons\n\n- A star of interchangeable leaves gets no plan, where a split was offered before.\n- An id-family overview may land below 60% of node_target.\n- A qualified label is longer, and the contract and both test readers accept one more form.\n- A detail on the side drawn whole no longer shows which member of the other group an edge reaches.\n- An edge drawn once for several no longer shows a label they do not share.\n"},"MJL-0034":{"file":"0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md","status":"accepted","title":"A refused plan prints the list or table that reads better, a pipeline folds by layer, aggregates draw no relationship twice, and a region holding most of a diagram folds as its parts","markdown":"<!-- GENERATED from MJL-0034 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a refused star prints its hub and every leaf as a list)\n- Extends [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (a refused dense mesh prints every link as an adjacency matrix)\n- Scoped exception to [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a tangled erDiagram folds past the target only aggregates adding no new reachable pair)\n- Scoped exception to [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (an aggregate draws no relationship twice, and a root's aggregate may fold trimmed)\n- Extends [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (with hubs folded, prefix families are kept apart before they are mixed, chain stages too)\n- Extends [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (a pair of one family sharing more overview neighbours folds first, so layers fold in step)\n- Scoped exception to [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (a region holding most of a diagram folds as its parts first)\n- Excepted by [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (a region holding most of a diagram folds whole, its detail split again, not as its parts first)\n- Excepted by [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (a chain stage may join prefix families, so an extract folds with the bronze table it lands in)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of a refusal has nothing to read but the reason. A reader of an overview counts lines and reads groups as the diagram's own layers. A plan that refuses because a list or table reads better owes the reader that list or table. An overview drawing two lines between one group and one entity reads as two relationships the original does not draw\n\n#### We prefer\n\nprinting, in a refused plan's place, the list or table its reason names. A star prints as a markdown list, starting with the node with the most links. Each of its links follows by way, label and connector, each leaf an item. Every other edge follows under its source, and a node no edge touches follows last. A dense mesh prints as a markdown table, a row and a column per node. Each cell holds every edge between its row and column, drawn from the row's side in both cells. A line before the table names the pairs no edge joins. Both are built from the parsed graph alone, and a test reads each back through mdast to find every node and edge. --split-plan prints it after the reason, and the remediation points to it. Under the third set of rules, hubs and branches fold while prefix families stay apart, before a walk mixes them. A chain stage keeps to one family wherever the rules keep families apart. Of two pairs of one family tied on gain and label, T6 takes the one sharing more of its overview neighbours. An aggregate folds only where it draws no relationship beside another between the same two overview nodes that the original draws between other ends. A root whose whole aggregate would draw one is also offered trimmed. Each owned part sharing an outside neighbour with the rest is cut away, and the trimmed fold may add no new reachable pair. Past the target, an aggregate folds only when it adds no new reachable pair. A region holding more than half of a diagram's nodes, beside another region holding nodes, is walked first as its parts. It then folds whole only when its detail fits, under every set of rules, and only when no such walk plans is it folded whole\n\n#### Because\n\na reader refused a plan still wants the diagram's story. A list of a hub's leaves or a matrix of a mesh tells it in full. A pipeline's layers are the author's own grouping, and a group of two layers hides where one ends. Two lines between one group and one entity read as two relationships, and a lookup chain shared by several owners belongs to none of them. A schema already within its target gains nothing from a fold that makes pairs reachable. One group holding most of a diagram beside small ones reads as that group alone\n\n#### Unless\n\na plan is refused for another reason, or a diagram names no prefix family. An aggregate may draw no relationship twice, or no region hold most of the diagram. The plan then stands as before\n\n## Consequences\n\n### Pros\n\n- The gateway star prints the gateway with its 3 clients and 34 services as a list.\n- The service mesh prints as a 15 by 15 matrix, naming its 11 unlinked pairs.\n- The ETL pipeline folds extracts, bronze, silver and gold tables apart, two lanes of extracts feeding two of bronze.\n- The film rental schema folds its address chain alone, and the university schema folds 3 tight aggregates with no new reachable pair.\n- The compiler's Ast namespace folds as its subtrees, no group holding a third of the diagram.\n\n### Cons\n\n- A star or mesh refusal prints a long list or a wide table.\n- The list and the matrix name a node by its label as a reader sees it, so markup inside a label is shown as text.\n- A schema whose aggregates all draw a relationship twice keeps more entities in view.\n- The compiler plan declares 4 new reachable pairs, where the whole namespace declared 2.\n"},"MJL-0035":{"file":"0035-a-region-folds-whole-and-a-nested-detail-names-members.md","status":"accepted","title":"An author region folds whole however much of a diagram it holds, a pipeline folds by lane, and a detail split again names the members it reaches","markdown":"<!-- GENERATED from MJL-0035 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a region holding most of a diagram folds whole, its detail split again, not as its parts first)\n- Scoped exception to [MJL-0034](0034-a-refusal-prints-its-list-or-table-and-folds-stay-tight.md) (a chain stage may join prefix families, so an extract folds with the bronze table it lands in)\n- Extends [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (of two groups joined both ways, the one whose detail is split again draws the other's members)\n- Extends [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (an author region folds whole however much of a diagram it holds)\n- Excepted by [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a nested overview names the member a reader is sent to with the group's shown label, as \"PAYMENT_METHOD (in CUSTOMER (+2))\")\n- Extended by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (twin chains fold whole however many there are, their detail split again into one group per lane, as an author region does)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of a split plan reads an author's namespace as the diagram's own story, and follows a stub to the node it names. A stub in a nested overview standing for a whole group sends the reader two levels back without saying which member it reaches. A pipeline's lanes carry each source to the table it lands in\n\n#### We prefer\n\nfolding an author region whole however much of a diagram it holds, its detail split again when it does not fit. A chain stage may join two prefix families, so each extract folds with the bronze table it lands in, and lanes alike fold as twins. Edges may join two groups both ways, and one group's detail may exceed the target and be split again while the other's fits. The group split again then draws every edge between them exactly, with stubs for the other's members. Otherwise the group needing stubs for fewer of the other's members draws them, as before. The other group's detail draws it whole, and still no detail draws a group whole beside a stub for one of its members\n\n#### Because\n\nraters preferred the whole namespace with its nested split to its parts, which read as tangled and lost more. A member stub in a nested overview names where the reader goes. A whole-group stub in a flat detail names a group the top overview already draws. Lanes read as sources flowing into their tables, where halves of a layer read as arbitrary cuts\n\n#### Unless\n\ntwo groups joined both ways may both, or neither, have details split again. A diagram may have no chain across prefix families, or no region holding most of it. The plan then stands as before\n\n## Consequences\n\n### Pros\n\n- The compiler plan folds Ast whole with its nested split and 2 new reachable pairs.\n- The e-commerce plan's nested ORDER detail names PAYMENT_METHOD (CUSTOMER) and CUSTOMER (in group).\n- The ETL pipeline folds two groups of lanes, each extract beside its bronze table, with no new reachable pair.\n\n### Cons\n\n- The compiler plan's top overview reads as the Ast group beside a few small ones.\n- The flat CUSTOMER detail draws ORDER (+6) whole for the payment it uses, not the PAYMENT member.\n- A group of lanes is named after its first extract, though it also holds bronze tables.\n"},"MJL-0036":{"file":"0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md","status":"accepted","title":"A group holding a whole family or twin lanes is named by them, a member stub names its group as the overview shows it, and one member's edges into a group draw in the target","markdown":"<!-- GENERATED from MJL-0036 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0030](0030-a-group-is-named-where-a-reader-enters-it.md) (twin chains whose stages a namespace or a first word names are named by those stages, not by an entry)\n- Scoped exception to [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (a member stub names its group by the label the overview shows)\n- Scoped exception to [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (a nested overview names the member a reader is sent to with the group's shown label, as \"PAYMENT_METHOD (in CUSTOMER (+2))\")\n- Scoped exception to [MJL-0032](0032-a-stage-folds-across-lanes-and-a-stub-draws-each-edge-once.md) (one member's edges into a group joined one way draw in the target's detail)\n- Excepted by [MJL-0037](0037-stubs-for-one-group-share-a-box-and-the-lighter-detail-draws-exactly.md) (a stub inside a box shows its member's own label)\n- Extended by [MJL-0037](0037-stubs-for-one-group-share-a-box-and-the-lighter-detail-draws-exactly.md) (a one-way pair's target draws its edges when it needs fewer stubs)\n- Extended by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (a lane's place may take two first words, and leaves are named by the node they hang from)\n- Excepted by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (a stub for a member of a pair, or for a group's namesake, shows its own label)\n- Extended by [MJL-0039](0039-rows-alone-fold-nothing-and-a-plan-says-why-it-was-flagged.md) (a flowchart run is named by where its flow enters and leaves, before a member's name)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of an overview reads a group's name as a promise about all its members. A name taken from one member promises that member and some others. A reader of a detail follows a stub to the overview node it names, and finds that node by its text\n\n#### We prefer\n\nnaming a group that holds a whole dotted family by the family, as \"gold.* (+5)\". Such a group holds three members or more, each label leading with one namespace and a dot. No node outside the group has a label leading with that namespace. Naming twin chains by their stages, as \"Extract \u2192 bronze (+8)\". The chains run two or more, each of one length of two members or more. Each place along them is named by the namespace every label there leads with. Failing that, it is named by the first word all of them lead with, and failing that it shows an ellipsis. At least one place must be named, and the label holds at most 40 characters. Both labels count every member, as an author region's label does. They come after an author region's label and a group's head, and before a range or any member's label. A stub for a member of a group takes its label, \" (in \", the label the overview shows for that group and \")\". That reads \"PAYMENT_METHOD (in CUSTOMER (+2))\", and for the member the group is named after, \"CUSTOMER (in CUSTOMER (+2))\". The contract and both test readers accept the two labels only as recomputed from the members. They accept the stub form only when its text has exactly one reading. Edges may join two groups one way only, all leaving one member and reaching two members or more. When the source's detail is not split again, the target's detail draws them exactly, from one stub for that member. The source's detail draws the target as one stub, each edge alike drawn once. Planning still measures each detail with such edges drawn from one stub for the whole source group. So the plan it picks is unchanged, and a drawn detail holds no more stubs than the one measured\n\n#### Because\n\na name built from what every member shares promises nothing a member lacks. A namespace held whole is the author's own name for those nodes. A reader of a pipeline reads its lanes as sources flowing into a layer. A stub naming its group by the overview's exact text is found at a glance, wherever it is drawn. A bare bracket or \"in group\" leaves the reader to guess which group, and inside a nested overview the nearest guess is wrong. A stub per target member repeats one source's fan-out in
