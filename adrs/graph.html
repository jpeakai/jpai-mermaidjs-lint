 its own detail, where one stub for the target group says the same. The target's detail draws each edge from the one stub it already needs\n\n#### Unless\n\na group holds only part of a family, or its chains share no namespace or first word at any place. It then keeps its region, head, range or member's name, as before. Another group may already show the label, and the group then takes its next label\n\n## Consequences\n\n### Pros\n\n- The ETL overview reads \"Extract \u2192 bronze (+8)\", \"\u2026 \u2192 bronze (+6)\" and \"gold.* (+5)\", where it read three members' names.\n- Every member stub names the overview node it sits in by its exact text, in flat and nested details alike.\n- A family label never claims a node it does not hold, so halves of a layer keep their members' names.\n- The pipeline's scheduler detail drops from eight stubs to three, and its quality-check detail from eight to five.\n- A GitOps region's detail drops from seven stubs to five.\n\n### Cons\n\n- A member stub's text grows by its group's count, and a namesake's stub repeats its own label.\n- A lane label's ellipsis says only that its sources share no word.\n- The contract, the reading and the checker each accept two more label forms.\n- The checker accepts one more case of a stub for another group's member.\n- A source's detail no longer shows which members of the target group each of its edges reaches, only that it reaches the group.\n"},"MJL-0037":{"file":"0037-stubs-for-one-group-share-a-box-and-the-lighter-detail-draws-exactly.md","status":"accepted","title":"Stubs for one group's members share a box, the lighter detail draws edges joining two groups one way, and a leaf fold saving alike keeps groups even","markdown":"<!-- GENERATED from MJL-0037 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a stub inside a box shows its member's own label)\n- Extends [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a one-way pair's target draws its edges when it needs fewer stubs)\n- Extends [MJL-0031](0031-a-plan-keeps-groups-even-and-names-each-stub-once.md) (of two leaf folds saving alike, the one leaving groups more even goes first)\n- Extended by [MJL-0038](0038-twin-chains-fold-whole-and-a-pair-names-both-members.md) (a target whose detail is split again draws the edges joining two groups one way)\n- Extended by [MJL-0041](0041-an-oversized-decision-region-opens-and-a-span-label-shows-whole.md) (an oversized decision region opens, so the groups stay even)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of a detail reads each stub as one outside thing, and finds it in the overview by its text. Several stubs showing one group's label in brackets read as that group drawn several times. A detail is read faster when its stubs are few, and a plan reads evenly when no detail carries most of them\n\n#### We prefer\n\ndrawing a flowchart detail's stubs for two or more members of one other group inside one box. The box is a subgraph at the top level, showing the label the overview shows for that group. Each stub inside it shows its member's own label, as \"Zuul edge proxy\" inside \"Edge tier (+2)\". A group may stand for one author region whole, when it folds that region and every member sits inside it. Its box then stands for the region, and an edge to the region meets the box. Any other group's box stands for the group and draws no edge. A group is boxed only when every stub for it stands for a member or for that region. Each stub must also show its plain text, and each member's label must name one member of the group. A detail draws its boxes, most stubs first, while it still meets its target, and a detail split again draws none. The contract and both test readers read a box as that group's region, or as the group. They read each stub inside it as the one member its label names. Edges may join two groups one way only. The target draws them exactly when it needs stubs for fewer of the source's members than the source needs of the target's. With as many, two or more, the target draws them when its detail meets fewer outside overview nodes than the source's. The target then draws a stub for each source member, and the source draws the target as one stub. That holds only while the target's detail still meets its target, with every group asking so drawn as stubs. Otherwise, or when the source's detail is split again, the source draws them, as before. In T5, of two folds saving as much per node hidden, the one whose largest group holds fewer members goes first\n\n#### Because\n\na box shows at a glance that its stubs belong to one group, where repeated brackets read as duplicates. A box standing for a region draws the edges to the region and to its members as the author drew them. Moving the exact edges to the detail that needs as few stubs or fewer, and meets fewer outside nodes, takes stubs from the heaviest detail. A detail's stubs for one group then usually fit one box. Two groups of one size read as two parts of one story. A group swallowing its neighbour's family is named after one member and hides the rest\n\n#### Unless\n\nthe diagram is not a flowchart, since a classDiagram namespace and an erDiagram take no label to show the group's. A box may not fit the target, or a member's label may name two members. The target's detail may not meet its target with the stubs it would need. The plan then draws stubs as before\n\n## Consequences\n\n### Pros\n\n- The streaming platform's Edge tier detail drops from seven stubs to five, one per domain, and each domain's detail boxes the Edge tier's stubs.\n- The boutique's Checkout detail drops from nine stubs to six, and its external API group boxes the four Checkout members it hears from.\n- The ETL pipeline, ticket graph and multiregion plans draw each group's stubs in one box.\n- The compiler's nested Ast overview keeps Node in view, names \"Expression (+3)\", and no longer draws \"Statement (in Statement (+3))\".\n\n### Cons\n\n- A box adds a subgraph, which weighs on a detail's score, so a tight detail keeps its bracketed stubs.\n- A stub inside a box no longer reads alone, since the box names its group.\n- A detail drawing a group whole may show two edges into its stub, from the detail's own region and from a member inside it.\n- The contract, the reading and the checker each accept one more stub form.\n- The checker accepts one more case of a stub for another group's member.\n"},"MJL-0038":{"file":"0038-twin-chains-fold-whole-and-a-pair-names-both-members.md","status":"accepted","title":"Twin chains fold whole, a group of two names both members, and leaves are named by the node they hang from","markdown":"<!-- GENERATED from MJL-0038 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0035](0035-a-region-folds-whole-and-a-nested-detail-names-members.md) (twin chains fold whole however many there are, their detail split again into one group per lane, as an author region does)\n- Scoped exception to [MJL-0029](0029-runs-meshes-and-terminals-read-as-they-are.md) (twin chains are never cut into runs, since no label sorts lanes)\n- Extends [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a lane's place may take two first words, and leaves are named by the node they hang from)\n- Scoped exception to [MJL-0036](0036-a-group-is-named-by-its-family-or-lanes-and-a-stub-by-its-group.md) (a stub for a member of a pair, or for a group's namesake, shows its own label)\n- Scoped exception to [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (a group of two shows the other member's label in place of the count)\n- Extends [MJL-0033](0033-a-plan-folds-what-the-author-grouped-and-refuses-buckets.md) (a tangled schema that meets its target by rows alone still folds its aggregates, each pair named by both members)\n- Extends [MJL-0037](0037-stubs-for-one-group-share-a-box-and-the-lighter-detail-draws-exactly.md) (a target whose detail is split again draws the edges joining two groups one way)\n- Excepted by [MJL-0039](0039-rows-alone-fold-nothing-and-a-plan-says-why-it-was-flagged.md) (a tangled schema that meets its target by rows alone stays at rows dropped)\n- Extended by [MJL-0039](0039-rows-alone-fold-nothing-and-a-plan-says-why-it-was-flagged.md) (a group of three names every member, as a group of two does)\n- Excepted by [MJL-0040](0040-closed-aggregates-fold-at-rows-dropped-and-leaves-are-listed.md) (a group of leaves whose labels fit a list is named by them, before the node they hang from)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of an overview reads a group's name as what it holds. A cut through alike things reads as a claim that they differ. A reader follows a stub to the overview text it names. Lanes carry each source to the table it lands in, and nothing in their labels sorts them\n\n#### We prefer\n\nfolding twin chains whole, over cutting them into runs by label order. When their detail does not fit, it is split again while the depth allows, and each lane folds as one group in it. Every lane of twin chains folds in one step, so lanes fold alike. Twin chains are cut into runs only when folding them whole gives no plan. A target whose detail is split again draws the edges joining two groups one way, from stubs for the source's members. A lane's place is named by the namespace its labels lead with. Failing that, it is the first word they all lead with. Failing that, it is the two first words they lead with between them, in natural order, joined by a slash, as \"Extract/Ingest \u2192 bronze (+14)\". A group of two members shows the label it is named after, then \" (+\", the other's label and \")\", as \"ROOM (+BUILDING)\". Neither label holds a bracket, a less-than sign, an ampersand, an asterisk, a hash or a n holding other regions can grow far larger than the groups beside it. A reader reads a group named by where its flow enters and leaves as the stage it is. A stub's text names the outside node it stands for, and a range label already names its first and last members\n\n#### We prefer\n\nopening a decision region the plan folded into a group holding more than twice the median group's members. This applies when the plan has three groups or more. The plan walks again with that region left open, so its decision shows in the overview and the regions inside it fold apart. It keeps the plan walked again when that plan meets the target and its largest group holds fewer members. It opens the next such region the same way. A loan flow at the medium preset then shows \"Thin file?\" between \"Score with open banking data \u2192 Alt score above 620? (+1)\" and \"Bureau score above 680? (+6)\", in an overview of 12 nodes. A span label holds at most twice LABEL_CAP characters, as a list of leaves may. It is never cut, since its two labels are what it says. So a sanctions stage reads \"Sanctions list hit? \u2192 Pull credit bureau file (+3)\". A stub for the first or the last member a range label names shows its own label alone, as \"REL-0042\". The contract and both test readers accept a span label up to the longer cap, only recomputed from the members, and only uncut\n\n#### Because\n\nthe groups raters scored highest held members of about one weight. The one group they kept naming was the one far larger than the rest. The low preset's plan, which cannot fold that region, already shows the decision and its branches apart. A span names a group by what it holds, and a count beside its first step does not. A label the overview shows whole reads better at 54 characters than a count, as raters found a list of 69 characters did. A stub repeating the range that names it says the same name twice\n\n#### Unless\n\nthe plan has fewer than three groups, or the large group is no decision region. The plan walked again may not meet the target, or its largest group may hold as many members, and the region then stays folded. The two labels of a span may hold more than twice LABEL_CAP characters, markup, an arrow or an ellipsis. The group then keeps its count. A member of a range group that the range does not name keeps its group's label in its stub\n\n## Consequences\n\n### Pros\n\n- The loan flow's medium overview shows 12 nodes, its largest group 7 members where it was 11.\n- The loan flow's high overview shows the thin-file decision, at 15 nodes where it was 16.\n- A release pipeline reads \"Deploy docs site \u2192 SLSA provenance attestation (+4)\", and an incident flow \"More than 10% of users? \u2192 Assign scribe and comms lead (+4)\".\n- The ticket-id plan's stubs read \"REL-0042\" and \"PLAT-1240\".\n\n### Cons\n\n- A plan with an oversized decision region walks twice.\n- The loan flow's high overview folds the senior sign-off into \"Amount above 50k? (+3)\", which it showed before.\n- A span label up to 80 characters widens its overview node.\n- The contract, the reading and the checker each accept a longer span label.\n"}}</script>

    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
