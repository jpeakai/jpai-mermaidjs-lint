# The docs site. It lives in its own folder because the linter reads an
# ancestor mkdocs.yml as "this markdown renders through Material": here, that
# is true only of the site's own pages, and the rest of the repo stays scored as
# GitHub renders it. Build with `make site`.
#
# Generated by scripts/build-site.ts, and ignored by git:
#   docs/reference/rules.md, docs/gallery/fixtures.md, docs/gallery/examples.md
#   snippets/  (CLI help and preset tables, included with --8<--)
#
# Authored, and included with --8<--:
#   diagrams/  (one diagram per file)
#   includes/  (text shared with the root markdown, such as tenets.md)
#
# The OsakaNights look comes from theme/osakanights/: the theme, palette, fonts
# and markdown extensions from its base config, and its stylesheet from
# custom_dir. A list set here replaces the base list, a mapping merges with it.
INHERIT: theme/osakanights/mkdocs.base.yml

site_name: mermaidjs-lint
site_description: Deterministic lint gates and verified fixers for Mermaid diagrams in markdown
site_url: https://jpeakai.github.io/jpai-mermaidjs-lint/
repo_url: https://github.com/jpeakai/jpai-mermaidjs-lint
repo_name: jpeakai/jpai-mermaidjs-lint
edit_uri: ""
copyright: MIT licence
docs_dir: docs
site_dir: ../tmp/docs-site
strict: true

theme:
  custom_dir: theme/osakanights/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jpeakai/jpai-mermaidjs-lint
      name: Source, issues and releases on GitHub

extra_css:
  - assets/extra.css
  - assets/complexity-graphs.css

extra_javascript:
  - path: assets/mermaid-github.js
    type: module
  - path: assets/complexity-graphs.js
    type: module

# A mapping, so it merges with the base extensions rather than replacing them.
markdown_extensions:
  pymdownx.snippets:
    # Resolved from the working directory, so `make site` runs from the repo root.
    base_path: [docs-site/snippets, docs-site/diagrams, docs-site/includes]
    check_paths: true
  pymdownx.superfences:
    # A list replaces the base one, so the base mermaid fence is repeated.
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
      # Examples scored under the github profile, drawn by plain mermaid as
      # GitHub draws them, because Material forces its own label colour.
      - name: mermaid-github
        class: mermaid-github
        format: !!python/name:pymdownx.superfences.fence_div_format

nav:
  - Home: index.md
  - Get started: get-started.md
  - Guides:
      - guides/index.md
      - Gate diagrams in CI: guides/ci.md
      - Check diagrams before each commit: guides/pre-commit.md
      - Configure the rules: guides/configure.md
      - Lint a MkDocs Material site: guides/mkdocs.md
      - Write a local rule: guides/local-rule.md
      - Publish a plugin package: guides/plugin-package.md
      - Troubleshooting: guides/troubleshooting.md
  - Concepts:
      - concepts/index.md
      - How a run works: concepts/how-it-works.md
      - The plugin model: concepts/plugin-model.md
      - Contrast profiles: concepts/contrast.md
      - Measuring complexity: concepts/complexity.md
      - Summarising a diagram: concepts/summarisation.md
  - Reference:
      - reference/index.md
      - Rules: reference/rules.md
      - Command line: reference/cli.md
      - Config file: reference/configuration.md
      - Document model: reference/document-model.md
      - Plugin API: reference/plugin-api.md
      - Library API: reference/library-api.md
  - Gallery:
      - gallery/index.md
      - Fixtures: gallery/fixtures.md
      - Layout examples: gallery/examples.md
      - Agent evals: gallery/agent-evals.md
