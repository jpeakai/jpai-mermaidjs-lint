L-0025","target":"MJL-0021","label":"see also","relation":"see_also","note":"the overview and every detail are scored by the same visual complexity score"}},{"data":{"id":"MJL-0025-see_also-MJL-0022","source":"MJL-0025","target":"MJL-0022","label":"see also","relation":"see_also","note":"the plan reads the parser's graph, and its emitted text is checked by parsing it again"}},{"data":{"id":"MJL-0026-extends-MJL-0025","source":"MJL-0026","target":"MJL-0025","label":"extends","relation":"extends","note":"how a fold offered as a split is chosen and drawn"}},{"data":{"id":"MJL-0026-extended_by-MJL-0028","source":"MJL-0026","target":"MJL-0028","label":"extended by","relation":"extended_by","note":"decision regions and erDiagram aggregates fold whole"}},{"data":{"id":"MJL-0027-extends-MJL-0023","source":"MJL-0027","target":"MJL-0023","label":"extends","relation":"extends","note":"MJL-0023 says a dependency gap is recorded rather than hand-written, and this record is that list"}},{"data":{"id":"MJL-0027-see_also-MJL-0022","source":"MJL-0027","target":"MJL-0022","label":"see also","relation":"see_also","note":"every feature starts from the official parsers' output, and these are the places that output falls short"}},{"data":{"id":"MJL-0028-extends-MJL-0026","source":"MJL-0028","target":"MJL-0026","label":"extends","relation":"extends","note":"the author's structure now includes the regions a flow's decisions make and the aggregates an erDiagram's identifying relationships make"}}],"layout":{"name":"cose"},"height":620}</script>
<script id="record-data" type="application/json">{"MJL-0001":{"file":"0001-parse-with-mermaids-own-parsers.md","status":"accepted","title":"Every diagram is measured by mermaid's own parsers","markdown":"<!-- GENERATED from MJL-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0002](0002-one-rule-per-finding-code.md) (every complexity rule reads these stats)\n- Extended by [MJL-0022](0022-start-from-the-official-parsers-output.md) (every feature starts from the official parsers' output, not only counting)\n- See also [MJL-0021](0021-the-score-counts-what-a-reader-must-read.md) (which of the parser's records the score counts)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule needs the nodes, edges and subgraphs of a diagram\n\n#### We prefer\n\nreading them from the parser result, over scanning the diagram text\n\n#### Because\n\nthe parser already implements the grammar exactly, so the counts are the ones a reader sees\n\n#### Unless\n\na diagram type has no parser result that exposes structure, which fails as an unparseable diagram\n\n## Consequences\n\n### Pros\n\n- Counts match what a reader sees.\n\n### Cons\n\n- The package depends on mermaid and a DOM shim.\n"},"MJL-0002":{"file":"0002-one-rule-per-finding-code.md","status":"accepted","title":"One rule per finding code, one file per rule","markdown":"<!-- GENERATED from MJL-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (the rules read the parsed stats)\n\n## Decision\n\n### The lens\n\n#### Given\n\na failure needs its own switch and its own message\n\n#### We prefer\n\na rule per code named category-short-name, over a rule that reports several codes\n\n#### Because\n\nthe config can then switch off or tune exactly what a project accepts\n\n#### Unless\n\ntwo codes can never be told apart by a reader\n\n## Consequences\n\n### Pros\n\n- Config can accept one finding without silencing its neighbours.\n\n### Cons\n\n- There are more rule files than codes in the scripts.\n"},"MJL-0003":{"file":"0003-findings-fail-or-the-rule-is-off.md","status":"accepted","title":"A finding fails the run, or the rule is off","markdown":"<!-- GENERATED from MJL-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0020](0020-category-flags-have-the-last-word-for-a-run.md) (a category flag only switches rules on or off for one run)\n\n## Decision\n\n### The lens\n\n#### Given\n\na check is uncertain enough that failing on it seems harsh\n\n#### We prefer\n\nmaking the rule off by default or removing the check, over reporting it without failing\n\n#### Because\n\na run that exits 0 should have nothing to report\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- The exit code and the output always agree.\n\n### Cons\n\n- A borderline heuristic must be removed or opted into.\n"},"MJL-0004":{"file":"0004-complexity-is-never-autofixed.md","status":"accepted","title":"No complexity rule has a fixer","markdown":"<!-- GENERATED from MJL-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (the split recommendation carries a concrete plan, checked by a contract and still never applied)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram exceeds a node or score threshold\n\n#### We prefer\n\nreporting it with a split recommendation, over rewriting it\n\n#### Because\n\nthe boundary of a split is a design decision\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A fix never changes what a diagram means.\n\n### Cons\n\n- A complexity finding always needs a human.\n"},"MJL-0005":{"file":"0005-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the answer is a design choice","markdown":"<!-- GENERATED from MJL-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [MJL-0006](0006-every-fix-is-verified-by-reparse.md) (the verifier backs a refusal with proof)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan that breaks its contract is not offered, as an unsure fixer refuses)\n\n## Decision\n\n### The lens\n\n#### Given\n\na failing label colour has many passing replacements\n\n#### We prefer\n\nreplacing a declared color only with black or white, and refusing otherwise, over choosing a nearby shade\n\n#### Because\n\nthe choice is deterministic and verifiable, and anything subtler is a design decision\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff.\n\n### Cons\n\n- Some fixable palettes stay reported.\n"},"MJL-0006":{"file":"0006-every-fix-is-verified-by-reparse.md","status":"accepted","title":"Every edit is proven by re-parsing the document","markdown":"<!-- GENERATED from MJL-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0005](0005-a-fixer-refuses-when-unsure.md) (a refusal is the normal outcome of a failed proof)\n\n## Decision\n\n### The lens\n\n#### Given\n\nan edit has been spliced into the source\n\n#### We prefer\n\nre-parsing the whole document and comparing structure, over trusting the fixer's offsets\n\n#### Because\n\nthe mermaid parser and the markdown parser are the authority on what the document says\n\n#### Unless\n\nthe expectation is same-tree, which only compares the markdown tree\n\n## Consequences\n\n### Pros\n\n- A buggy or plugin fixer cannot corrupt a diagram unnoticed.\n\n### Cons\n\n- Every fix pass parses mermaid again.\n"},"MJL-0007":{"file":"0007-plugins-follow-the-prose-gates-contract.md","status":"accepted","title":"Plugins follow the prose-gates contract","markdown":"<!-- GENERATED from MJL-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na user wants a rule this package does not ship\n\n#### We prefer\n\na plugin whose default export is { meta, rules }, discovered from .mermaidjs-lint/rules and mermaidjs-lint-plugin-* dependencies, over a second rule interface\n\n#### Because\n\nthe engine, the verifier and the config treat every rule alike, and one convention serves both tools\n\n#### Unless\n\nthe contract must change in a way a plugin would notice, which bumps apiVersion\n\n## Consequences\n\n### Pros\n\n- A plugin rule is configured and listed like a built-in.\n\n### Cons\n\n- apiVersion is one integer, so a breaking change fails every plugin.\n"},"MJL-0008":{"file":"0008-node-bundle-keeps-mermaid-external.md","status":"accepted","title":"The Node bundle keeps mermaid and its parsers external","markdown":"<!-- GENERATED from MJL-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\ndist must run on Node without Bun\n\n#### We prefer\n\nbundling only this package's own source, over bundling every dependency\n\n#### Because\n\nnpm already installs the dependencies, and mermaid chooses its own dynamic imports\n\n#### Unless\n\na dependency ships TypeScript only\n\n## Consequences\n\n### Pros\n\n- The bundle stays small and mermaid resolves itself.\n\n### Cons\n\n- A consumer needs the dependencies installed.\n"},"MJL-0009":{"file":"0009-a-diagram-is-read-from-the-markdown-tree.md","status":"accepted","title":"A diagram is a code node of the markdown tree","markdown":"<!-- GENERATED from MJL-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the markdown tree comes only from mdast)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule or a fixer needs the diagrams of a document and their positions\n\n#### We prefer\n\ntaking them from the parsed tree and mapping a directive back to the source line, over scanning lines\n\n#### Because\n\nthe tree gives exact fences and exemptions, and a mapped line lets a fixer edit inside a list or quote\n\n#### Unless\n\na line cannot be mapped back, in which case the fixer refuses\n\n## Consequences\n\n### Pros\n\n- Every fence the renderer would draw is checked.\n\n### Cons\n\n- A fence tagged mermaid with extra attributes is also read, which the scripts did not.\n"},"MJL-0010":{"file":"0010-thresholds-are-options-not-environment.md","status":"accepted","title":"Thresholds are rule options and flags, never environment variables","markdown":"<!-- GENERATED from MJL-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na project needs different density limits\n\n#### We prefer\n\nsetting preset or a numeric threshold per rule in the config, with a run flag on top, over environment variables\n\n#### Because\n\nthe config is committed and reviewed, so the verdict is reproducible\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A verdict is a function of the repo and the command line.\n\n### Cons\n\n- A CI job that relied on the variables must move to the config.\n"},"MJL-0011":{"file":"0011-profile-decides-who-owns-label-text.md","status":"accepted","title":"A contrast profile decides who owns the label text","markdown":"<!-- GENERATED from MJL-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram is read through a host theme that overrides its colours\n\n#### We prefer\n\nscoring the host text against each fill composited over both theme backgrounds, over scoring the declared color\n\n#### Because\n\nthe pair a reader sees is the one that must pass\n\n#### Unless\n\nthe profile is github, where the author controls the text\n\n## Consequences\n\n### Pros\n\n- A diagram that passes reads in both themes.\n\n### Cons\n\n- The host's colours are constants that can drift from the theme.\n"},"MJL-0012":{"file":"0012-a-fixture-declares-its-own-expectation.md","status":"accepted","title":"A fixture declares what it must report in its own file","markdown":"<!-- GENERATED from MJL-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\ndiagrams that misbehave keep turning up, and each one should become a regression case\n\n#### We prefer\n\nan expect comment inside the fixture plus an optional .fixed sibling, over a central table of expectations in test code\n\n#### Because\n\nadding a case is then adding one file, and the expectation travels with the diagram it describes\n\n#### Unless\n\na case needs options or a profile other than the defaults, which then needs a richer comment\n\n## Consequences\n\n### Pros\n\n- A contributor adds a case without touching test code.\n- The docs site renders the same files with the same expectations.\n\n### Cons\n\n- Distinct rule ids are compared, not finding counts or lines, so a second finding of the same rule goes unnoticed.\n"},"MJL-0013":{"file":"0013-the-docs-site-is-generated-from-tested-sources.md","status":"accepted","title":"The docs site is generated from the sources the tests run","markdown":"<!-- GENERATED from MJL-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe site shows every rule and fixture before and after --fix, rendered through Material\n\n#### We prefer\n\ngenerating the reference pages at build time from RULES.md, tests/fixtures and examples, over committing hand-written pages\n\n#### Because\n\na page that is regenerated and re-checked on every build cannot show behaviour the tool no longer has\n\n#### Unless\n\na page explains something no test source holds, which is then authored under docs-site/docs and linted like any other page\n\n## Consequences\n\n### Pros\n\n- The site doubles as a test suite, run on every pull request.\n- The site lives in docs-site, so only its own pages are scored under the mkdocs-material profile.\n\n### Cons\n\n- The reference pages exist only after make site, so they cannot be read on GitHub.\n"},"MJL-0014":{"file":"0014-an-llm-fix-is-committed-and-verified.md","status":"accepted","title":"An LLM fix is committed beside its fixture and verified clean","markdown":"<!-- GENERATED from MJL-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe gallery should show what an LLM would change to clear a finding that --fix refuses\n\n#### We prefer\n\nan LLM fix authored once and committed as a .llm sibling with its reason, over calling a model while the site builds\n\n#### Because\n\na committed fix is reviewed like code, gives the same page on every build, and needs no API key or network in CI\n\n#### Unless\n\nthe corpus grows past what can be reviewed by hand, when a script may draft fixes that are still committed and checked\n\n## Consequences\n\n### Pros\n\n- Every refused finding in the gallery shows a reviewed, working resolution and the reason for it.\n- The suite proves each LLM fix clears its findings, so a stale one fails CI.\n\n### Cons\n\n- An LLM fix can drift in meaning from its fixture while still linting clean, and only review catches that.\n"},"MJL-0015":{"file":"0015-four-tenets-define-the-tool.md","status":"accepted","title":"Four tenets define what the tool guarantees","markdown":"<!-- GENERATED from MJL-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (split plans serve the visual complexity tenet)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule, a flag or a feature is proposed for the core package\n\n#### We prefer\n\naccepting it only when it serves one of the four tenets, over accepting any useful check\n\n#### Because\n\nfour stated guarantees tell a user what a clean run means, and tell a contributor what the core is for\n\n#### Unless\n\na check serves none of them, in which case it ships as a plugin, which the fourth tenet exists to make easy\n\n## Consequences\n\n### Pros\n\n- A clean run has a precise meaning a user can rely on.\n- Scope questions are settled by pointing at a tenet, not by taste.\n\n### Cons\n\n- Useful checks outside the tenets, such as a house naming style, have to live in plugins.\n"},"MJL-0016":{"file":"0016-a-back-edge-may-be-appended-to-an-accepted-record.md","status":"accepted","title":"A back-edge may be appended to an accepted record","markdown":"<!-- GENERATED from MJL-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\na new record declares a typed relation, such as supersedes, to an older accepted record\n\n#### We prefer\n\nappending the inverse relation to the older record's relates_to, over leaving the relation one-way\n\n#### Because\n\nthe graph is only checkable when both ends agree, and the append adds a fact without changing what the older record decided\n\n#### Unless\n\nthe edit would change any other field of the older record, which still needs a new superseding record\n\n## Consequences\n\n### Pros\n\n- Every relation can be read from either end, and the generator can check the pair.\n\n### Cons\n\n- Accepted records are no longer byte-for-byte frozen, so review must check an edit touches relates_to only.\n"},"MJL-0017":{"file":"0017-sequence-colours-come-from-mermaids-theme-engine.md","status":"accepted","title":"Sequence colours come from Mermaid's own theme engine","markdown":"<!-- GENERATED from MJL-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0018](0018-a-host-sets-the-page-canvas-under-github-only.md) (the sequence pairs on the page are scored on the canvas)\n- See also [MJL-0024](0024-colour-and-contrast-come-from-colorjs.md) (their contrast is scored by colorjs.io)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sequence diagram has no style directives, and its colours are theme variables that Mermaid derives from each other\n\n#### We prefer\n\nreading the config with mermaid.parse and resolving every variable with Mermaid's theme engine on an exact pinned version, over copying Mermaid's palettes into the package\n\n#### Because\n\nthe derived colours change between Mermaid releases, and a copy drifts silently while a pin changes only in a reviewed bump\n\n#### Unless\n\nthe profile is mkdocs-material, where Material's CSS forces every sequence label and box, so only lifelines, arrowheads and activation bars are scored, as advisory borders\n\n## Consequences\n\n### Pros\n\n- A sequence diagram that passes reads in both themes on the pinned Mermaid.\n- Frontmatter and init directives merge the way the renderer merges them.\n\n### Cons\n\n- A consumer gets the pinned Mermaid, and a host on another version may derive other colours.\n- Mermaid's own dark theme draws note text at 4.49 to 1, so a note with no colours set fails.\n"},"MJL-0018":{"file":"0018-a-host-sets-the-page-canvas-under-github-only.md","status":"accepted","title":"A host sets the page canvas, under the github profile only","markdown":"<!-- GENERATED from MJL-0018 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0017](0017-sequence-colours-come-from-mermaids-theme-engine.md) (the sequence pairs on the page are scored on the canvas)\n- Excepted by [MJL-0019](0019-a-material-file-sets-a-config-canvas-aside.md) (a config canvas on a file the auto profile reads as mkdocs-material is set aside rather than refused)\n\n## Decision\n\n### The lens\n\n#### Given\n\ntranslucent fills, edge label boxes and page-backed sequence elements are scored on the page colour. A host other than GitHub draws its own page.\n\n#### We prefer\n\na canvas of opaque light and dark colours that defaults to GitHub's, over fixed GitHub colours or a profile per host. It is set by --canvas-light and --canvas-dark, a canvas rule option or RunFlags.\n\n#### Because\n\nthe page is the one github profile assumption a host may change. One setting covers every page-backed pair without a new profile.\n\n#### Unless\n\nthe file is scored under mkdocs-material, whose page is Material's own. There a canvas is a usage error rather than ignored, because an ignored canvas reports a pass it never affected.\n\n## Consequences\n\n### Pros\n\n- A host with its own page colours scores diagrams as its readers see them.\n- A run that sets no canvas reports exactly what it did before.\n\n### Cons\n\n- A run over a tree where auto picks mkdocs-material for some files fails if it sets a canvas, so those files need their own run.\n- The canvas is a page colour only. A host that also restyles Mermaid's own surfaces is not modelled.\n"},"MJL-0019":{"file":"0019-a-material-file-sets-a-config-canvas-aside.md","status":"accepted","title":"A Material file sets a config canvas aside","markdown":"<!-- GENERATED from MJL-0019 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [MJL-0018](0018-a-host-sets-the-page-canvas-under-github-only.md) (a config canvas on a file the auto profile reads as mkdocs-material is set aside rather than refused)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe auto profile reads a file as mkdocs-material, and the only canvas for it comes from the config, which covers the whole tree\n\n#### We prefer\n\nsetting the canvas aside for that file, scoring it under mkdocs-material, and printing one note that names every such file, over stopping the run\n\n#### Because\n\nthe config cannot scope a canvas to a path, and the auto profile already decides which page each file is drawn on. The note keeps the set-aside visible, so it never reads as a silent pass.\n\n#### Unless\n\nthe canvas comes from --canvas-light or --canvas-dark, or the profile is set to mkdocs-material by flag or rule option. Each of those is an explicit setting for this run, so it is still refused with a usage error.\n\n## Consequences\n\n### Pros\n\n- One config with a canvas serves a repo that holds a Material site beside its GitHub-rendered markdown.\n- The run reports findings for every file instead of stopping at the first Material file.\n\n### Cons\n\n- A config canvas that the user meant for a Material file is dropped rather than refused, so the note is the only signal.\n"},"MJL-0020":{"file":"0020-category-flags-have-the-last-word-for-a-run.md","status":"accepted","title":"Category flags have the last word for a run","markdown":"<!-- GENERATED from MJL-0020 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [MJL-0003](0003-findings-fail-or-the-rule-is-off.md) (a category flag only switches rules on or off, so a finding still fails the run or its rule is off)\n\n## Decision\n\n### The lens\n\n#### Given\n\na user wants one run to check a different set of categories from the one the config describes\n\n#### We prefer\n\nsettling the rules in three steps. Every loaded rule starts on, the config turns some off, then the category flags turn whole categories on or off\n\n#### Because\n\na flag is an explicit choice for this run, so it outranks the standing config, as --preset and --profile already do. A re-enabled rule keeps its configured options, so it runs as the config describes it.\n\n#### Unless\n\nthe flags name a category no loaded source declares, name one category both ways, or turn off every rule. Each would check something other than what was asked, so it is a usage error rather than a guess.\n\n## Consequences\n\n### Pros\n\n- A run can check one category, or skip one, without touching the config.\n- --list-rules with the same flags shows exactly which rules a run would use.\n\n### Cons\n\n- A run can pass with a category switched off, so a CI gate that wants every category must not pass --disable-category.\n"},"MJL-0021":{"file":"0021-the-score-counts-what-a-reader-must-read.md","status":"accepted","title":"The score counts what a reader must read, not every record the parser keeps","markdown":"<!-- GENERATED from MJL-0021 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (every count is still read from the parser's result, never the text)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan's overview and details are scored by this score)\n\n## Decision\n\n### The lens\n\n#### Given\n\na parser's result holds records with nothing to read, such as a block's closing line or a start marker. It also files some things a reader does read, such as attributes, outside its nodes\n\n#### We prefer\n\ncounting messages, boxes, blocks, states and rows, and leaving out control lines, markers and notes. That is preferred over counting every record the parser keeps\n\n#### Because\n\nthe score stands for what a reader must find, trace and hold. A record with nothing to read inflates it, and a missed boundary or row deflates it\n\n#### Unless\n\na type draws a record as something the reader must place, as a fork or a choice is, which stays a node\n\n## Consequences\n\n### Pros\n\n- A sequence diagram with blocks, notes and activations scores its messages, not every statement.\n- A large entity or class scores higher than an empty one.\n- A sequence diagram whose blocks nest three deep fires the nesting rule, as a flowchart does.\n\n### Cons\n\n- Scores change for sequence, state, entity and class diagrams, so a diagram near a threshold may cross it either way on upgrade.\n- The row weight is a judgement, not a measured value.\n"},"MJL-0022":{"file":"0022-start-from-the-official-parsers-output.md","status":"accepted","title":"Every feature starts from the official parsers' output, and no parsing logic is reinvented","markdown":"<!-- GENERATED from MJL-0022 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (MJL-0001 covers counting, and this record covers every feature, emitted text and every other dependency)\n- See also [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the same rule for markdown and every other dependency)\n- See also [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (a split plan reads the parser's graph and parses its emitted text again)\n- See also [MJL-0027](0027-gaps-in-the-official-parsers-are-recorded.md) (the places the official parsers' output falls short, each with its pinned workaround)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs something a diagram or a document says. That may be a node, an edge label, a shape, an arrow, a block or a fence\n\n#### We prefer\n\nstarting from the result of the canonical parsers, which are mermaid core, @mermaid-js/parser and mdast. That is preferred over writing a parser, a tokeniser or a regex over the text, and over rebuilding anything an installed dependency already provides\n\n#### Because\n\nthe official parsers implement the grammar the renderer draws, so a reimplementation can only drift from it. A second parser also doubles the code to test and maintain\n\n#### Unless\n\nnever. Text a feature emits is checked by parsing it again with the same parsers, never by scanning it\n\n## Consequences\n\n### Pros\n\n- Every structure a rule or a split plan reads is the one mermaid draws.\n- A new mermaid release that changes the grammar changes this package's reading with it.\n\n### Cons\n\n- A fact the parser result does not expose cannot be used until mermaid exposes it.\n- Some parser results are internal shapes, which a mermaid upgrade may change and the tests must catch.\n"},"MJL-0023":{"file":"0023-markdown-is-read-only-through-mdast.md","status":"accepted","title":"Markdown is read only through mdast, and reimplementing a dependency is non-compliance","markdown":"<!-- GENERATED from MJL-0023 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0009](0009-a-diagram-is-read-from-the-markdown-tree.md) (a diagram is read from the markdown tree, and that tree comes only from mdast)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (the same rule for diagram text and mermaid's parsers)\n- See also [MJL-0024](0024-colour-and-contrast-come-from-colorjs.md) (the same rule for colour parsing and contrast)\n- Extended by [MJL-0027](0027-gaps-in-the-official-parsers-are-recorded.md) (the recorded gaps in mermaid, each with the one narrow workaround allowed)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs a markdown structure, such as a fence, its language, its position, a heading or frontmatter. Or it needs something an installed dependency already provides\n\n#### We prefer\n\nreading markdown only from the mdast tree, and calling the dependency that already does the job. That is preferred over a custom markdown parser, and over reimplementing any part of a library this package depends on\n\n#### Because\n\nthe dependency is already tested, maintained and shipped, so a second version only adds code that can drift from it. Duplicated logic is treated as non-compliance and refactored onto the dependency\n\n#### Unless\n\nnever. When a dependency lacks a feature, the gap is recorded and solved with another maintained library, not a hand-written parser\n\n## Consequences\n\n### Pros\n\n- Every fence and position the linter reports is the one CommonMark and GFM define.\n- Less code to test, and fixes upstream arrive with an upgrade.\n\n### Cons\n\n- A behaviour the dependency gets wrong must be fixed upstream or worked around in its output, never by parsing the text again.\n"},"MJL-0024":{"file":"0024-colour-and-contrast-come-from-colorjs.md","status":"accepted","title":"Colour parsing and WCAG contrast come only from colorjs.io","markdown":"<!-- GENERATED from MJL-0024 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (the same rule for markdown and every other dependency)\n- See also [MJL-0017](0017-sequence-colours-come-from-mermaids-theme-engine.md) (sequence colours come from mermaid's theme engine, and their contrast from colorjs.io)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule needs to read a colour, blend a translucent fill, or score contrast against WCAG or APCA\n\n#### We prefer\n\ncalling colorjs.io for the parse, the colour space conversion and the contrast ratio. That is preferred over writing our own colour parser, luminance formula or ratio\n\n#### Because\n\ncolorjs.io reads every CSS Color Level 4 syntax and implements the published WCAG 2.1 and APCA algorithms. A copy of that maths can only drift from it\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A ratio the linter reports matches the WCAG 2.1 definition, for every colour syntax a browser reads.\n\n### Cons\n\n- The contrast rules depend on colorjs.io's release cadence for any change to a contrast algorithm.\n"},"MJL-0025":{"file":"0025-a-fold-is-offered-as-a-split.md","status":"accepted","title":"A fold is offered only as the overview half of a split","markdown":"<!-- GENERATED from MJL-0025 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (how a plan is chosen and drawn faithfully)\n- Extends [MJL-0004](0004-complexity-is-never-autofixed.md) (the split recommendation now carries a concrete plan, and is still never applied)\n- See also [MJL-0005](0005-a-fixer-refuses-when-unsure.md) (like a fixer that is unsure, a plan that breaks the contract is not offered)\n- See also [MJL-0015](0015-four-tenets-define-the-tool.md) (the plan serves the visual complexity tenet)\n- See also [MJL-0021](0021-the-score-counts-what-a-reader-must-read.md) (the overview and every detail are scored by the same visual complexity score)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (the plan reads the parser's graph, and its emitted text is checked by parsing it again)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram over a node count or score threshold\n\n#### We prefer\n\noffering a fold only as the overview half of a split, with one detail diagram per group, checked by a contract on the emitted text. That is preferred over a replacement diagram, and over a fixer\n\n#### Because\n\nthe boundary of a split is a design decision, so the plan is a recommendation a human applies (MJL-0004). A split also stays recoverable, since the overview and the details together keep every node and edge\n\n#### Unless\n\nno plan meets the contract. Then no plan is offered, and the finding keeps its subgraph hint\n\n## Consequences\n\n### Pros\n\n- A complexity finding names where to cut, not only how small to cut.\n- A plan never loses a node or an edge, because the contract parses what it emits.\n- The tool still never edits a diagram for a complexity finding.\n\n### Cons\n\n- Working out a plan adds time to a check of every oversized diagram.\n- A plan groups by structure and label stems, so its groups may not match the author's intent.\n- Compromise was rejected, so the label stemming stays in this package and is tested here.\n"},"MJL-0026":{"file":"0026-a-split-plan-follows-the-authors-structure.md","status":"accepted","title":"A split plan follows the author's structure, and refuses what it cannot draw faithfully","markdown":"<!-- GENERATED from MJL-0026 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0025](0025-a-fold-is-offered-as-a-split.md) (how a fold offered as a split is chosen and drawn)\n- Extended by [MJL-0028](0028-decision-regions-and-aggregates-fold-whole.md) (decision regions and erDiagram aggregates fold whole)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram over a threshold can be folded many ways, and some folds change what it says\n\n#### We prefer\n\nfolding the author's own regions first and folding repeated patterns evenly. A state a composite's marker reaches stays in that composite, and each edge between kept nodes is drawn as often as it was written. Edges from another group start at one stub for that group. A composite with concurrent regions gets no plan\n\n#### Because\n\na reader trusts the author's boundaries first. A plan that moves a marker, merges an edge or joins concurrent regions says something the original does not\n\n#### Unless\n\nno plan meets the contract, when the finding keeps the subgraph hint\n\n## Consequences\n\n### Pros\n\n- Every emitted overview and detail parses back to the original's nodes, regions, edges and markers.\n- A diagram with subgraphs is folded along them, as an author would split it.\n\n### Cons\n\n- Some state diagrams with pinned composites or concurrent regions get no plan.\n- Drawing region boxes in details costs score, so some details are split again.\n"},"MJL-0027":{"file":"0027-gaps-in-the-official-parsers-are-recorded.md","status":"accepted","title":"Gaps in the official parsers are recorded, each with the one narrow workaround allowed","markdown":"<!-- GENERATED from MJL-0027 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0023](0023-markdown-is-read-only-through-mdast.md) (MJL-0023 says a dependency gap is recorded rather than hand-written, and this record is that list)\n- See also [MJL-0022](0022-start-from-the-official-parsers-output.md) (every feature starts from the official parsers' output, and these are the places that output falls short)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs something mermaid does not expose. There are four such gaps. First, mermaid keeps no source map from the preprocessed text it parses back to the diagram source. Second, decodeEntities is exported only from a hash-named chunk. Third, mermaid core has no zenuml detector. Fourth, styles2Map, which reads a style declaration, is internal\n\n#### We prefer\n\none narrow workaround per gap, each pinned by a test. A position is recovered only from the official lexer's tokens. A parsed line is placed in the source only when exactly one body line past the frontmatter can be it. Otherwise the span is refused. decodeEntities is a copy whose behaviour a test pins to mermaid's. The zenuml detector is a one-line type detector registered through registerExternalDiagrams. styles2Map is a mirror whose output a test pins to mermaid's compiled styles. That is preferred over a custom parser, and over a text match that picks a best guess\n\n#### Because\n\neach workaround stays as small as the gap, and its test fails the day mermaid's behaviour drifts from it. A refusal keeps a fixer from rewriting text it cannot place, per MJL-0005\n\n#### Unless\n\nmermaid exposes the missing piece, when the workaround is deleted and the dependency is called instead. A new gap is added to this record by a superseding record, never worked around unrecorded\n\n## Consequences\n\n### Pros\n\n- Every place the package does not call mermaid directly is listed in one record, with the test that pins it.\n- A position that could be wrong is refused, so a fix never edits frontmatter or a line mermaid dropped.\n\n### Cons\n\n- Some values, such as a classDiagram's or one after text mermaid edited out, are never placed, so their contrast findings are reported without a fix.\n- The tests read mermaid's hash-named chunks, which a mermaid upgrade renames, so they find each chunk by its source text.\n"},"MJL-0028":{"file":"0028-decision-regions-and-aggregates-fold-whole.md","status":"accepted","title":"Decision regions and erDiagram aggregates fold whole, named after their decision or root","markdown":"<!-- GENERATED from MJL-0028 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [MJL-0026](0026-a-split-plan-follows-the-authors-structure.md) (the author's structure now includes the regions a flow's decisions make and the aggregates an erDiagram's identifying relationships make)\n\n## Decision\n\n### The lens\n\n#### Given\n\na flowchart or stateDiagram where most nodes are decisions, and an erDiagram whose overview groups entities by leaves and junctions rather than by what owns what\n\n#### We prefer\n\nfolding a decision with its region, from the decision to its immediate post-dominator, where its branches rejoin. Dominators and post-dominators come from the algorithm of Cooper, Harvey and Kennedy (2001), with a virtual entry and exit. A branch ending at a terminal node is an outcome folded inside the region, not an exit from it. Every edge into the region enters the decision and every edge out reaches the rejoin node, as in the program structure tree of Johnson, Pearson and Pingali (1994). Such a fold invents no path, so it belongs to T2, the lossless tier. Regions fold innermost first, are named after their decision, and keep their branch labels in the detail. A chain stage may pass through a folded region. In an erDiagram an entity is owned by its single identifying parent, or as a leaf by the one entity it depends on. T4 folds the largest aggregate whose detail fits, named after its root, or each root's aggregate split again when none fits. A junction identified by two roots folds into neither side, and T5 and T6 keep it in view\n\n#### Because\n\na decision's branches only make sense together, and a region folded whole keeps them together without adding reachability. Identifying relationships are the author's statement of ownership, so an overview whose edges run between aggregate roots reads as the author's model\n\n#### Unless\n\na region has a second entry or a second exit, when the decision stays protected, or an erDiagram declares no identifying relationship, when T5 and T6 fold it as before\n\n## Consequences\n\n### Pros\n\n- Decision-heavy flowcharts get plans that read as a sequence of named checks.\n- The declared loss after T2 stays zero, since a decision region adds no reachable pair.\n- erDiagram overviews connect aggregate roots, and a junction table stays a junction.\n\n### Cons\n\n- A decision whose branches leave through two different nodes is still protected, so some flows get no region.\n- An aggregate split again draws no rows, so more attribute rows are declared dropped.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>

  }

      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +

  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle

  function applyTheme(name) {

    const t = themes[name];
    if (t) {

    if (graphInstance) style(graphInstance);

  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived

  const elements = graph.elements;

    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  function style(cy) {

      {

        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,

      {
        // A status that is not "accepted" earns a ring rather than a hue.

        style: {

          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,

          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
