name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate npm prepublishOnly runs. Node 20 is the engines floor, and
  # Node 24 is what the publish job uses.
  check:
    runs-on: ubuntu-latest
    name: Check (Node ${{ matrix.node }})
    # The split-plan suite reads every emitted plan back through the parsers,
    # so the gate runs 7 to 10 minutes; 20 leaves room for slow runners.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # The docs site build re-checks every example and fixture against the
      # tool, so it runs here too, in the Check job every pull request is
      # merged on, not only in the Docs workflow. Once per matrix is enough,
      # so it runs on the publish Node.
      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.node == '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: make check

      - name: Build site
        if: matrix.node == '24'
        run: |
          uv sync --frozen
          make site
