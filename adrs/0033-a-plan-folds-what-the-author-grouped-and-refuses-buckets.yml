id: MJL-0033
slug: a-plan-folds-what-the-author-grouped-and-refuses-buckets
plan_id: null
title: A plan folds ticket families whole, echoing regions alike and tangled aggregates, refuses alphabetical buckets, and draws a group whole or as members
description: How a split plan treats stars, tangled schemas, ticket families, echoing regions and groups joined both ways
status: accepted
accepted_on: 2026-10-19
last_changed_on: 2026-10-19
tags: [complexity, split]

provenance: >-
  A blind paired rating of 24 plans gave a mean of 3.79 out of 5, every plan correct.
  A gateway with 34 leaf services got three groups named "accounts-service … feature-flag-service", which carry no meaning.
  A university schema met its target by dropping rows alone, so its overview kept all 23 entities and 30 relationships.
  A film rental schema folded only LANGUAGE into FILM, leaving a 15-node overview of the original.
  A Jira epic graph split PLAT tickets across two groups and five loose hubs.
  A two-region cloud diagram folded us-east-1 whole and eu-west-1 into three subnets, so two groups showed "Public subnets (+2)" and a detail split again declared 9 new reachable pairs.
  An order lifecycle detail drew ReturnRequested as two stubs, and three labelled transitions from one group into Allocating side by side
enforced_in:
  - src/split/index.ts isStar and STAR, which refuse a plan whose every group is a range of one star's sibling leaves
  - src/split/plan.ts aggregatesToo, tangled and evenOut, which fold aggregates evenly in a tangled erDiagram, each fold taking an overview edge away per entity it hides
  - src/split/tier6.ts idFamilies and src/split/plan.ts byFamilies, which fold each id family whole, hubs and all, or in even contiguous runs
  - src/split/tier3.ts echoesOf and proposeT3, which fold echoing regions in one step
  - src/split/plan.ts fitting and nestedLoss, which prefer a plan holding regions to details that fit when it declares fewer new reachable pairs in all
  - src/split/quotient.ts qualifiedLabel, src/split/assemble.ts optionsOf, and src/split/contract.ts qualifiedLabels, which name echoing regions apart by the region around them
  - src/split/quotient.ts exactSide, detailView, halfKey and halfOf, which draw a group joined both ways whole or as members, and edges alike one way between a group's stub and a member once
  - src/split/contract.ts recovered, wantedHalves and detailNodes, which read a half edge from either side and refuse a group drawn whole beside a stub for its member

relates_to:
  - relation: extends
    target: MJL-0030
    note: a star of leaves sorted by nothing is refused, as a dense mesh is
  - relation: excepts
    target: MJL-0029
    note: sibling-leaf runs named by range are not offered when they are every group of one star
  - relation: extends
    target: MJL-0028
    note: a tangled erDiagram folds aggregates past the target, down to the share an evened overview keeps
  - relation: excepts
    target: MJL-0031
    note: id families fold whole below the share an evened overview keeps, and a family group is never undone
  - relation: extends
    target: MJL-0032
    note: in a ticket graph a whole id family folds before any pair, hubs included
  - relation: extends
    target: MJL-0026
    note: regions drawn from one template fold to the same depth and are named by the region around them
  - relation: excepts
    target: MJL-0032
    note: a group is drawn whole or as its members, never both, and like edges to a member draw once
  - relation: extended_by
    target: MJL-0034
