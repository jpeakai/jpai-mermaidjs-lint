<script id="record-data" type="application/json">{"MJL-0001":{"file":"0001-parse-with-mermaids-own-parsers.md","status":"accepted","title":"Every diagram is measured by mermaid's own parsers","markdown":"<!-- GENERATED from MJL-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A diagram is a grammar, not a line format. Counting nodes with a regex disagrees with the renderer on every unusual diagram.\n\n## Relates to\n\n- Depended on by [MJL-0002](0002-one-rule-per-finding-code.md) (every complexity rule reads these stats)\n\n## Problem\n\n### Symptom\n\nA regex counted nodes in a flowchart and missed subgraphs, ports and multi-line labels.\n\n### Pain point\n\nA complexity verdict rested on a count the renderer would not have produced.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule needs the nodes, edges and subgraphs of a diagram\n- **We prefer**: reading them from the parser result, over scanning the diagram text\n- **Because**: the parser already implements the grammar exactly, so the counts are the ones a reader sees\n- **Unless**: a diagram type has no parser result that exposes structure, which fails as an unparseable diagram\n\n### In practice\n\n- Langium grammars cover the newer types, and mermaid core covers the rest through a happy-dom shim.\n- A diagram that yields no nodes from multi-line source is reported, never rated clean.\n\n## Consequences\n\n### Pros\n\n- Counts match what a reader sees.\n\n### Cons\n\n- The package depends on mermaid and a DOM shim.\n"},"MJL-0002":{"file":"0002-one-rule-per-finding-code.md","status":"accepted","title":"One rule per finding code, one file per rule","markdown":"<!-- GENERATED from MJL-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A rule that reports several kinds of failure can only be switched off as a group.\n\n## Relates to\n\n- Depends on [MJL-0001](0001-parse-with-mermaids-own-parsers.md) (the rules read the parsed stats)\n\n## Problem\n\n### Symptom\n\nOne script reported parse failures, node limits, score limits and nesting under a single exit code.\n\n### Pain point\n\nA project that tolerated deep nesting had to ignore every complexity result.\n\n## Decision\n\n### The lens\n\n- **Given**: a failure needs its own switch and its own message\n- **We prefer**: a rule per code named category-short-name, over a rule that reports several codes\n- **Because**: the config can then switch off or tune exactly what a project accepts\n- **Unless**: two codes can never be told apart by a reader\n\n### In practice\n\n- A ladder of thresholds is a set of rules that each own one band, so only the most severe fires.\n- A parse failure suppresses the complexity rules for that diagram, because thresholds mean nothing against unread structure.\n\n## Consequences\n\n### Pros\n\n- Config can accept one finding without silencing its neighbours.\n\n### Cons\n\n- There are more rule files than codes in the scripts.\n"},"MJL-0003":{"file":"0003-findings-fail-or-the-rule-is-off.md","status":"accepted","title":"A finding fails the run, or the rule is off","markdown":"<!-- GENERATED from MJL-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A warning costs attention and protects nothing, because people and agents learn to ignore it.\n\n## Problem\n\n### Symptom\n\nA border that cannot clear 3:1 in both themes was printed as advisory and exited 0.\n\n### Pain point\n\nOutput carried findings that no gate enforced.\n\n## Decision\n\n### The lens\n\n- **Given**: a check is uncertain enough that failing on it seems harsh\n- **We prefer**: making the rule off by default or removing the check, over reporting it without failing\n- **Because**: a run that exits 0 should have nothing to report\n- **Unless**: never\n\n### In practice\n\n- A rule is either on and failing, or switched off in the config.\n- A pair the original auditor marked advisory is not reported.\n\n## Consequences\n\n### Pros\n\n- The exit code and the output always agree.\n\n### Cons\n\n- A borderline heuristic must be removed or opted into.\n"},"MJL-0004":{"file":"0004-complexity-is-never-autofixed.md","status":"accepted","title":"No complexity rule has a fixer","markdown":"<!-- GENERATED from MJL-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A fixer that shortens or splits a diagram edits its meaning, and no check can prove the meaning survived.\n\n## Problem\n\n### Symptom\n\nA mechanical split cut a diagram across the one edge that explained it.\n\n### Pain point\n\nThe result passed the threshold and lost the point of the diagram.\n\n## Decision\n\n### The lens\n\n- **Given**: a diagram exceeds a node or score threshold\n- **We prefer**: reporting it with a split recommendation, over rewriting it\n- **Because**: the boundary of a split is a design decision\n- **Unless**: never\n\n### In practice\n\n- The remediation names existing subgraph boundaries and a per-diagram target.\n- The verifier would have no structure-preserving expectation to hold a split to.\n\n## Consequences\n\n### Pros\n\n- A fix never changes what a diagram means.\n\n### Cons\n\n- A complexity finding always needs a human.\n"},"MJL-0005":{"file":"0005-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the answer is a design choice","markdown":"<!-- GENERATED from MJL-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A wrong autofix is worse than none. The finding still asks a human, while a silent rewrite changes a palette nobody reviewed.\n\n## Relates to\n\n- Depended on by [MJL-0006](0006-every-fix-is-verified-by-reparse.md) (the verifier backs a refusal with proof)\n\n## Problem\n\n### Symptom\n\nA fixer that adjusted lightness kept the hue and changed the identity of a palette.\n\n### Pain point\n\nThe check passed and the diagram no longer matched its documentation.\n\n## Decision\n\n### The lens\n\n- **Given**: a failing label colour has many passing replacements\n- **We prefer**: replacing a declared color only with black or white, and refusing otherwise, over choosing a nearby shade\n- **Because**: the choice is deterministic and verifiable, and anything subtler is a design decision\n- **Unless**: never\n\n### In practice\n\n- No fix is offered when color is not declared, under a host profile, or for an erDiagram.\n- A directive scored on both light and dark canvases is fixed only when one colour passes all of them.\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff.\n\n### Cons\n\n- Some fixable palettes stay reported.\n"},"MJL-0006":{"file":"0006-every-fix-is-verified-by-reparse.md","status":"accepted","title":"Every edit is proven by re-parsing the document","markdown":"<!-- GENERATED from MJL-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A fixer proposes, and the engine disposes. A fixer cannot be the judge of its own edit.\n\n## Relates to\n\n- Depends on [MJL-0005](0005-a-fixer-refuses-when-unsure.md) (a refusal is the normal outcome of a failed proof)\n\n## Problem\n\n### Symptom\n\nA colour edit that landed on the wrong line would still have parsed.\n\n### Pain point\n\nThe edit looked right and altered another diagram.\n\n## Decision\n\n### The lens\n\n- **Given**: an edit has been spliced into the source\n- **We prefer**: re-parsing the whole document and comparing structure, over trusting the fixer's offsets\n- **Because**: the mermaid parser and the markdown parser are the authority on what the document says\n- **Unless**: the expectation is same-tree, which only compares the markdown tree\n\n### In practice\n\n- The verifier is asynchronous, because a diagram is re-parsed by mermaid.\n- A refused edit is remembered while its source slice is unchanged, so the loop converges.\n\n## Consequences\n\n### Pros\n\n- A buggy or plugin fixer cannot corrupt a diagram unnoticed.\n\n### Cons\n\n- Every fix pass parses mermaid again.\n"},"MJL-0007":{"file":"0007-plugins-follow-the-prose-gates-contract.md","status":"accepted","title":"Plugins follow the prose-gates contract","markdown":"<!-- GENERATED from MJL-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A third-party rule must not need a second code path in the engine. The only new thing a plugin brings is a name that cannot clash.\n\n## Problem\n\n### Symptom\n\nA house style could only be added by changing this repository.\n\n### Pain point\n\nTeams forked the package to add one rule.\n\n## Decision\n\n### The lens\n\n- **Given**: a user wants a rule this package does not ship\n- **We prefer**: a plugin whose default export is { meta, rules }, discovered from .mermaidjs-lint/rules and mermaidjs-lint-plugin-* dependencies, over a second rule interface\n- **Because**: the engine, the verifier and the config treat every rule alike, and one convention serves both tools\n- **Unless**: the contract must change in a way a plugin would notice, which bumps apiVersion\n\n### In practice\n\n- Rule ids read namespace/category-short-name, and local files use the reserved namespace local.\n- A throwing check becomes a finding for that rule, and a throwing fixer stops the run.\n\n## Consequences\n\n### Pros\n\n- A plugin rule is configured and listed like a built-in.\n\n### Cons\n\n- apiVersion is one integer, so a breaking change fails every plugin.\n"},"MJL-0008":{"file":"0008-node-bundle-keeps-mermaid-external.md","status":"accepted","title":"The Node bundle keeps mermaid and its parsers external","markdown":"<!-- GENERATED from MJL-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Bundling mermaid inlines its whole renderer and its dynamic chunks, and breaks nothing a normal install would not fix.\n\n## Problem\n\n### Symptom\n\nA bundled mermaid made the package tens of megabytes and duplicated it.\n\n### Pain point\n\nInstalling the tool downloaded the renderer twice.\n\n## Decision\n\n### The lens\n\n- **Given**: dist must run on Node without Bun\n- **We prefer**: bundling only this package's own source, over bundling every dependency\n- **Because**: npm already installs the dependencies, and mermaid chooses its own dynamic imports\n- **Unless**: a dependency ships TypeScript only\n\n### In practice\n\n- No Bun global appears in src, and a test runs the bundle under Node.\n- The installed size includes mermaid.\n\n## Consequences\n\n### Pros\n\n- The bundle stays small and mermaid resolves itself.\n\n### Cons\n\n- A consumer needs the dependencies installed.\n"},"MJL-0009":{"file":"0009-a-diagram-is-read-from-the-markdown-tree.md","status":"accepted","title":"A diagram is a code node of the markdown tree","markdown":"<!-- GENERATED from MJL-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: The markdown parser already knows what a fence is. A line scanner disagrees with it inside lists and quotes.\n\n## Problem\n\n### Symptom\n\nA fence indented in a list was ignored, so its diagram was never checked.\n\n### Pain point\n\nA gate exited clean on a document it had not read.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule or a fixer needs the diagrams of a document and their positions\n- **We prefer**: taking them from the parsed tree and mapping a directive back to the source line, over scanning lines\n- **Because**: the tree gives exact fences and exemptions, and a mapped line lets a fixer edit inside a list or quote\n- **Unless**: a line cannot be mapped back, in which case the fixer refuses\n\n### In practice\n\n- A standalone .mmd file is one diagram with no tree around it.\n- An unclosed fence is reported, and closed only when nothing follows it.\n\n## Consequences\n\n### Pros\n\n- Every fence the renderer would draw is checked.\n\n### Cons\n\n- A fence tagged mermaid with extra attributes is also read, which the scripts did not.\n"},"MJL-0010":{"file":"0010-thresholds-are-options-not-environment.md","status":"accepted","title":"Thresholds are rule options and flags, never environment variables","markdown":"<!-- GENERATED from MJL-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A result that depends on inherited shell state differs between a laptop and CI for no reason anyone can read.\n\n## Problem\n\n### Symptom\n\nAn exported variable changed a gate's verdict without a change to the repo.\n\n### Pain point\n\nThe same commit passed in one shell and failed in another.\n\n## Decision\n\n### The lens\n\n- **Given**: a project needs different density limits\n- **We prefer**: setting preset or a numeric threshold per rule in the config, with a run flag on top, over environment variables\n- **Because**: the config is committed and reviewed, so the verdict is reproducible\n- **Unless**: never\n\n### In practice\n\n- The order is the flag, then the rule option, then the default preset high-density.\n- Preset aliases such as low and strict are kept.\n\n## Consequences\n\n### Pros\n\n- A verdict is a function of the repo and the command line.\n\n### Cons\n\n- A CI job that relied on the variables must move to the config.\n"},"MJL-0011":{"file":"0011-profile-decides-who-owns-label-text.md","status":"accepted","title":"A contrast profile decides who owns the label text","markdown":"<!-- GENERATED from MJL-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Contrast is a property of a pair, and which pair is read depends on who controls the text.\n\n## Problem\n\n### Symptom\n\nA diagram that passed under the declared colours was unreadable in one Material theme.\n\n### Pain point\n\nThe gate passed a diagram a reader could not read.\n\n## Decision\n\n### The lens\n\n- **Given**: a diagram is read through a host theme that overrides its colours\n- **We prefer**: scoring the host text against each fill composited over both theme backgrounds, over scoring the declared color\n- **Because**: the pair a reader sees is the one that must pass\n- **Unless**: the profile is github, where the author controls the text\n\n### In practice\n\n- auto reads mkdocs-material when an ancestor holds mkdocs.yml, and github otherwise.\n- A translucent fill is composited over each canvas and the worse result gates.\n\n## Consequences\n\n### Pros\n\n- A diagram that passes reads in both themes.\n\n### Cons\n\n- The host's colours are constants that can drift from the theme.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle
  // only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived
  // rather than assigned: fill is the group, size is in-degree (how many records
  // refine or supersede this one). Status rides on the border, because usually only
  // a couple of records are superseded and a whole colour channel would be wasted.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its group colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // A status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"], node[status = "retired"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: 'node[status = "proposed"]',
        style: { "border-width": 2, "border-color": css("muted"), "border-opacity": 1, "border-style": "dotted" },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
