id: MJL-0033
slug: a-plan-folds-what-the-author-grouped-and-refuses-buckets
plan_id: null
title: A plan folds ticket families whole, echoing regions alike and tangled aggregates, and refuses alphabetical buckets
description: How a split plan treats a star, a tangled erDiagram, a ticket graph and regions drawn from one template
status: accepted
accepted_on: 2026-10-19
last_changed_on: 2026-10-19
tags: [complexity, split]

provenance: >-
  A blind paired rating of 24 plans gave a mean of 3.79 out of 5, every plan correct.
  A gateway with 34 leaf services got three groups named "accounts-service … feature-flag-service", which carry no meaning.
  A university schema met its target by dropping rows alone, so its overview kept all 23 entities and 30 relationships.
  A film rental schema folded only LANGUAGE into FILM, leaving a 15-node overview of the original.
  A Jira epic graph split PLAT tickets across two groups and five loose hubs.
  A two-region cloud diagram folded us-east-1 whole and eu-west-1 into three subnets, so two groups showed "Public subnets (+2)" and a detail split again declared 9 new reachable pairs
enforced_in:
  - src/split/index.ts isStar and STAR, which refuse a plan whose every group is a range of one star's sibling leaves
  - src/split/plan.ts aggregatesToo, tangled and evenOut, which fold aggregates evenly in a tangled erDiagram, each fold taking an overview edge away per entity it hides
  - src/split/tier6.ts idFamilies and src/split/plan.ts byFamilies, which fold each id family whole, hubs and all, or in even contiguous runs
  - src/split/tier3.ts echoesOf and proposeT3, which fold echoing regions in one step
  - src/split/plan.ts fitting and nestedLoss, which prefer a plan holding regions to details that fit when it declares fewer new reachable pairs in all
  - src/split/quotient.ts qualifiedLabel, src/split/assemble.ts optionsOf, and src/split/contract.ts qualifiedLabels, which name echoing regions apart by the region around them

relates_to:
  - relation: extends
    target: MJL-0030
    note: a star of leaves sorted by nothing is refused, as a dense mesh is
  - relation: excepts
    target: MJL-0029
    note: sibling-leaf runs named by range are not offered when they are every group of one star
  - relation: extends
    target: MJL-0028
    note: a tangled erDiagram folds aggregates past the target, down to the share an evened overview keeps
  - relation: excepts
    target: MJL-0031
    note: id families fold whole below the share an evened overview keeps, and a family group is never undone
  - relation: extends
    target: MJL-0032
    note: in a ticket graph a whole id family folds before any pair, hubs included
  - relation: extends
    target: MJL-0026
    note: regions drawn from one template fold to the same depth and are named by the region around them

decision:
  given: a reader of an overview reads its groups as the diagram's own structure. The reader compares regions drawn from one template side by side, and counts relationships as lines. A ticket key or a template is the author's own grouping, and an alphabetical range is no grouping at all
  we_prefer: >-
    refusing a plan whose every group is a run of sibling leaves of one twin class, named only by a range.
    Such groups must hold more than half the diagram.
    The reason given is "a star of leaves around one node, which no label, shape or neighbour sorts: a list reads better".
    An erDiagram overview is tangled when its independent cycles, edges less nodes plus one, number at least a quarter of its nodes.
    A tangled one folds aggregates once the target is met, even by dropping rows alone.
    Each fold must take away an overview edge per entity it hides and add no more new reachable pairs than it hides.
    It stops at 60% of node_target.
    When every label leads with an id naming a prefix family, as PLAT-1201, T6 first offers each family whole, hubs included.
    A family whose detail does not fit is offered as even contiguous runs in natural order, each connected, in one step.
    Once one family folds, the evening takes only families, down to the fewest nodes a fold may leave.
    Loosening never undoes a family's group.
    Two regions echo when they are siblings of one shape holding regions of their own, or children of echoing regions with one label and shape.
    A region's shape is its own node count and each child region's label and shape.
    T3 folds a region with all its echoes in one step, and waits for an echo not yet ready.
    Another group may be named after a region of the same label.
    A region's group then takes the label of the region around it in brackets, as "Public subnets (us-east-1) (+2)".
    It sits in that region in the overview and counts every member.
    A plan whose details split again with new reachable pairs is walked again, holding regions to details that fit.
    That walk first folds only regions adding no new reachable pair.
    It is offered when it declares fewer new reachable pairs in all
  because: >-
    alphabetical buckets give a reader nothing to find, while a list of the leaves gives the same in reading order.
    An overview of every entity and relationship is the original with its rows hidden, and aggregates are the structure an erDiagram carries.
    A tree-like overview already reads, so it stays as it is.
    A ticket family scattered across groups and loose hubs reads as noise, while one group per family reads as the author's plan.
    Two regions drawn from one template folded to different depths read as different things.
    Their groups need names a reader can tell apart without an id
  unless: a plan has no star, or a diagram has no aggregate that takes an edge away per entity. Labels may name no id family, or regions echo none. The plan then stands as before
consequences:
  pros:
    - The gateway is refused with a reason rather than offered alphabetical buckets.
    - The university and film rental overviews fold their aggregates, and the WordPress tree stays at rows dropped.
    - The Jira epic graph shows one group per ticket family and no loose node.
    - The two cloud regions fold into three subnets each, named apart, with no new reachable pair and no detail split again.
  cons:
    - A star of interchangeable leaves gets no plan, where a split was offered before.
    - An id-family overview may land below 60% of node_target.
    - A qualified label is longer, and the contract and both test readers accept one more form.
